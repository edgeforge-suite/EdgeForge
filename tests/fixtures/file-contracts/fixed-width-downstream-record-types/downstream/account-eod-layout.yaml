format: fixed-width
encoding: ISO-8859-1
record_types:
  header:
    indicator:
      position: 1
      length: 1
      value: H
    fields:
      - name: file_date
        length: 8
        type: date
        format: yyyyMMdd
        required: true
        value_source: system_date
      - name: run_id
        length: 12
        type: string
        required: true
        value_source: batch_run_id
  data:
    indicator:
      position: 1
      length: 1
      value: D
    fields:
      - name: account_number
        length: 12
        type: string
        required: true
      - name: available_balance_minor
        length: 14
        type: integer
        required: true
      - name: opened_date
        length: 8
        type: date
        format: yyyyMMdd
        required: true
  trailer:
    indicator:
      position: 1
      length: 1
      value: T
    fields:
      - name: record_count
        length: 8
        type: integer
        required: true
        value_source: data_record_count
      - name: total_balance_minor
        length: 14
        type: integer
        required: true
        value_source: sum(Account.availableBalance)
        type_coercion: major_to_minor_units

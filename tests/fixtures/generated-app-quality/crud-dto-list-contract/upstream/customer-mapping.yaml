        target: Customer.customerName
      - source: email
        target: Customer.email
      - source: status
        target: Customer.status
  - name: listCustomers
    request_mappings: []
    response_mappings:
      - source: customerId
        target: Customer.customerId
      - source: customerName
        target: Customer.customerName
      - source: email
        target: Customer.email
      - source: status
        target: Customer.status
  - name: pageCustomers
    request_mappings: []
    response_mappings:
      - source: customerId
        target: Customer.customerId
      - source: customerName
        target: Customer.customerName
      - source: email
        target: Customer.email
      - source: status
        target: Customer.status

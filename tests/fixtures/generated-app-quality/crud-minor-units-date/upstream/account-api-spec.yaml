openapi: 3.0.0
info:
  title: CRUD minor-unit date fixture
  version: "1.0"
paths:
  /accounts:
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNumber
                - openedDate
                - availableBalance
              properties:
                accountNumber:
                  type: string
                openedDate:
                  type: string
                  format: date
                availableBalance:
                  type: number
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountId
                  - accountNumber
                  - openedDate
                  - availableBalance
                  - status
                properties:
                  accountId:
                    type: string
                  accountNumber:
                    type: string
                  openedDate:
                    type: string
                    format: date
                  availableBalance:
                    type: number
                  status:
                    type: string

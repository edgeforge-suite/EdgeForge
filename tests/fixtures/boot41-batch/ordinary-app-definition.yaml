app_name: Ordinary Batch Preview Proof
bounded_context: ordinary_batch_proof
schema_version: "2.0"
app_archetype: crud
upstream_interfaces:
  - name: widget-api
    system: SYNTHETIC_SOURCE
    type: rest-json
    spec: widget-api.json
    mapping: widget-api-mapping.yaml
    operations:
      - name: createWidget
        request_sample: widget-request.json
        response_sample: widget-response.json
data_handoffs:
  - name: widget-staging
    system: SYNTHETIC_HANDOFF
    type: staging-table
    spec: widget-staging.sql
    mapping: widget-staging-mapping.yaml
target_profile: springboot-legacy-compatible

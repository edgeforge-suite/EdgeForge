openapi: 3.0.0
info:
  title: SOAP Outbound Canonical Customer API
  version: "1.0"
paths:
  /customers:
    post:
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{customerId}:
    get:
      operationId: getCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
components:
  schemas:
    CreateCustomerRequest:
      type: object
      required:
        - customerName
        - status
      properties:
        customerName:
          type: string
        status:
          type: string
    Customer:
      type: object
      required:
        - customerId
        - customerName
        - status
      properties:
        customerId:
          type: string
        customerName:
          type: string
        status:
          type: string

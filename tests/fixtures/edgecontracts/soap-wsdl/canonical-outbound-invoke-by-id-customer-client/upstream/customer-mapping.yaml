interface: customer-api
entity: Customer
operations:
  - name: createCustomer
    request_mappings:
      - source: customerName
        target: Customer.customerName
      - source: status
        target: Customer.status
    response_mappings:
      - source: customerId
        target: Customer.customerId
      - source: customerName
        target: Customer.customerName
      - source: status
        target: Customer.status
  - name: getCustomer
    request_mappings: []
    response_mappings:
      - source: customerId
        target: Customer.customerId
      - source: customerName
        target: Customer.customerName
      - source: status
        target: Customer.status

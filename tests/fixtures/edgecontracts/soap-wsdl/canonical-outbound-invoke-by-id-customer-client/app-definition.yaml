# Primary fixture manifest for outbound SOAP canonical invoke_by_id proof.
#
# References the invoke_by_id canonical mapping. Slice 1 accepts this manifest
# into Engine metadata; later runtime slices should produce a standalone Spring
# Boot application that exposes:
#   POST /soap/outbound/customer-sync-client/syncCustomer
#
app_name: SOAP Outbound Canonical Customer Client
bounded_context: soap_outbound_canonical_customer
schema_version: "2.0"
upstream_interfaces:
  - name: customer-api
    system: CRM
    type: rest-json
    spec: upstream/customer-api-spec.yaml
    mapping: upstream/customer-mapping.yaml
    operations:
      - name: createCustomer
        request_sample: upstream/create-customer-request.json
        response_sample: upstream/customer-response.json
      - name: getCustomer
        response_sample: upstream/customer-response.json
downstream_interfaces:
  - name: customer-sync-client
    system: CUSTOMER_CORE
    type: soap-wsdl
    wsdl_path: contracts/customer-sync-service.wsdl
    service: CustomerSyncService
    port: CustomerSyncServicePort
    mapping: mappings/customer-soap-outbound-canonical-mapping.yaml
target_profile: springboot-legacy-compatible

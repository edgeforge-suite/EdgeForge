openapi: 3.0.3
info:
  title: App A Payments API
  version: "1.0"
paths:
  /payments:
    post:
      operationId: sendPaymentToAppA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundPaymentRequest"
      responses:
        "200":
          description: Payment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundPaymentResponse"
components:
  schemas:
    OutboundPaymentRequest:
      type: object
      required:
        - paymentAmount
        - currencyCode
        - originatorName
        - beneficiaryName
      properties:
        paymentAmount:
          type: number
          format: double
        currencyCode:
          type: string
        originatorName:
          type: string
        beneficiaryName:
          type: string
    OutboundPaymentResponse:
      type: object
      properties:
        status:
          type: string

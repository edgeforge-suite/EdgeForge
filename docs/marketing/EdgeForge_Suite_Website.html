0 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#4ade80;margin-bottom:9px\">DEVELOPER SERVICE · PRESERVED<\u002Fdiv>\n                  <div style=\"font:600 12.5px/1.5 'IBM Plex Mono',monospace;color:#eaf1fb;overflow-wrap:break-word\">{{ hoSvcFile2 }}<\u002Fdiv>\n                  <div style=\"font:400 11px/1.5 'IBM Plex Mono',monospace;color:#8ea3c2;margin-top:4px\">unchanged · your business logic<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:16px\">\n                <span data-anim=\"\" style=\"animation:efRise .4s ease 1.5s backwards;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:1.2px;color:#8ea3c2\">THEN, EVERY TIME:<\u002Fspan>\n                <span data-anim=\"\" style=\"animation:efRise .45s ease 1.65s backwards;display:inline-flex;align-items:center;gap:7px;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:100px;padding:8px 13px\"><span style=\"color:#4ade80\">✓<\u002Fspan>HUMAN REVIEW<\u002Fspan>\n                <span data-anim=\"\" style=\"animation:efRise .45s ease 1.85s backwards;display:inline-flex;align-items:center;gap:7px;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:100px;padding:8px 13px\"><span style=\"color:#4ade80\">✓<\u002Fspan>BUILD<\u002Fspan>\n                <span data-anim=\"\" style=\"animation:efRise .45s ease 2.05s backwards;display:inline-flex;align-items:center;gap:7px;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:100px;padding:8px 13px\"><span style=\"color:#4ade80\">✓<\u002Fspan>TESTS<\u002Fspan>\n                <span data-anim=\"\" style=\"animation:efRise .45s ease 2.25s backwards;display:inline-flex;align-items:center;gap:7px;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:100px;padding:8px 13px\"><span style=\"color:#4ade80\">✓<\u002Fspan>CONTRACT CHECKS<\u002Fspan>\n              <\u002Fdiv>\n              <div data-anim=\"\" style=\"animation:efRise .5s ease 2.5s backwards;margin-top:12px;font:400 12.5px/1.6 'Instrument Sans',sans-serif;color:#8ea3c2\">Destructive schema change or a stale approval? <span style=\"color:#f87171;font-weight:600\">Generation fails closed<\u002Fspan> — nothing regenerates silently.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);min-height:64px;max-width:1000px;font:400 13.5px/1.65 'Instrument Sans',sans-serif;color:#c3d4ea;text-wrap:pretty\">{{ hoCaption }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px\">\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px\">\n            <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#7db8ff;margin-bottom:8px\">STANDARD &amp; STANDALONE<\u002Fdiv>\n            <div style=\"font:400 12.5px/1.55 'Instrument Sans',sans-serif;color:#c3d4ea\">{{ hoCard1 }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px\">\n            <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#2dd4bf;margin-bottom:8px\">CONTEXT TRAVELS WITH THE APP<\u002Fdiv>\n            <div style=\"font:400 12.5px/1.55 'Instrument Sans',sans-serif;color:#c3d4ea\">{{ hoCard2 }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px\">\n            <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#4ade80;margin-bottom:8px\">CRUD EXTENSION &amp; REGENERATION<\u002Fdiv>\n            <div style=\"font:400 12.5px/1.55 'Instrument Sans',sans-serif;color:#c3d4ea\">{{ hoCard3 }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:14px;border-left:2px solid rgba(251,191,36,.45);padding:2px 0 2px 14px;max-width:900px\">\n          <span style=\"font:600 9.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:1.3px;color:#fbbf24\">ADOPTER CONTROL · <\u002Fspan>\n          <span style=\"font:400 12.5px/1.65 'Instrument Sans',sans-serif;color:#8ea3c2\">Coding-assistant use is an adopter development-tool choice, not an EdgeForge runtime capability. All proposed changes remain subject to human review, tests, contract checks, and adopter release controls.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div style=\"max-width:780px;margin-top:64px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">07 · WHAT DEVELOPERS STILL IMPLEMENT<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(22px,2.7vw,30px)/1.18 'Instrument Sans',sans-serif;letter-spacing:-.7px;color:#ffffff;text-wrap:balance\">The foundation is generated. The product is not.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">EdgeForge emits a runnable application foundation, not a completed business implementation. Engineering still owns:<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <ul style=\"margin:20px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 24px;font:400 14px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">\n          <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Product-specific workflows and orchestration<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Business policies and their edge cases<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Authorization and entitlement decisions<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Exception and compensation handling<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Integration behavior outside the supported families and directions<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Production hardening, capacity, and operational readiness<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div data-howband=\"\">\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div style=\"max-width:780px;margin-top:64px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">08 · CRUD REGENERATION &amp; ADDITIVE DATABASE EVOLUTION<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(22px,2.7vw,30px)/1.18 'Instrument Sans',sans-serif;letter-spacing:-.7px;color:#ffffff;text-wrap:balance\">Regeneration is CRUD-scoped — and refuses destructive change.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Proven CRUD maintain-over-time refreshes generated base code while preserving developer-owned service logic. Supported additive database changes generate new Flyway migrations; destructive or drifted changes fail closed for review. Identical regeneration behavior is not claimed for Kafka-integration or passthrough shapes.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n      <!-- PANE: maintain / regenerate -->\n      \n      <div id=\"regen-panel\" style=\"margin-top:26px;background:#f4f1e9;border:1px solid #d7d1c6;border-radius:16px;padding:24px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center\">\n          <div>\n            <div style=\"font:600 12px/1 'IBM Plex Mono',monospace;color:#15803d;margin-bottom:6px\">CRUD maintain · regenerate-safe<\u002Fdiv>\n            <h3 style=\"margin:0;font:650 19px/1.25 'Instrument Sans',sans-serif;letter-spacing:-.3px;color:#1e3a5f\">Regenerate CRUD apps after hand edits — safely<\u002Fh3>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ replayRegen }}\" style=\"margin-left:auto;font:600 12px/1 'Instrument Sans',sans-serif;color:#15803d;background:rgba(21,128,61,.08);border:1px solid rgba(21,128,61,.35);border-radius:100px;padding:9px 16px;cursor:pointer\" style-hover=\"background:rgba(21,128,61,.16)\">↻&nbsp; Run regenerate<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;display:grid;gap:8px\">\n          <sc-for list=\"{{ regenRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"{{ r.rowStyle }}\">\n              <span style=\"{{ r.markStyle }}\">{{ r.mark }}<\u002Fspan>\n              <span style=\"font:600 12.5px/1.3 'IBM Plex Mono',monospace;color:#0f1b2d;word-break:break-word\">{{ r.path }}<\u002Fspan>\n              <span style=\"font:400 12px/1.3 'Instrument Sans',sans-serif;color:#475569\">{{ r.note }}<\u002Fspan>\n              <span style=\"{{ r.tagStyle }}\">{{ r.tag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font:500 11.5px/1.6 'IBM Plex Mono',monospace;color:#475569\">Before → after: CRUD developer-owned service layer preserved · additive migrations applied · destructive changes fail closed. Studio regenerate preview is opt-in.<\u002Fdiv>\n      <\u002Fdiv>\n      \n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:{{ ovDisp }}\">\n        <div style=\"margin-top:34px;background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px 28px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.3)\">\n          <span style=\"display:inline-flex;align-items:center;gap:9px;flex:none;font:600 11.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:.6px;color:#4ade80\"><span style=\"width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e;flex:none\"><\u002Fspan>ACCEPTANCE EVIDENCE<\u002Fspan>\n          <span style=\"flex:1 1 340px;min-width:0;font:400 14px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea;text-wrap:pretty\">v4.1.0 suite acceptance passed for the documented scenarios. The acceptance evidence pack is available from this view — request it from your EdgeForge contact.<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ setTechnical }}\" style=\"flex:none;display:inline-flex;align-items:center;gap:8px;background:rgba(125,184,255,.22);border:1px solid rgba(125,184,255,.7);color:#7db8ff;font:600 12.5px/1 'Instrument Sans',sans-serif;padding:11px 18px;border-radius:100px;cursor:pointer\" style-hover=\"background:rgba(125,184,255,.22);color:#ffffff\" style-focus=\"outline:2px solid #7db8ff;outline-offset:2px\">Open Technical view →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ WHAT ENGINEERING RECEIVES (biz, light) ============ -->\n  <section id=\"receives\" data-screen-label=\"What engineering receives\" style=\"display:{{ ovDisp }};position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d\">\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 28px 90px\">\n      <div data-reveal=\"\" style=\"max-width:820px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#7db8ff;margin-bottom:16px\">WHAT ENGINEERING RECEIVES<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">A runnable application foundation, not a completed business implementation.<\u002Fh2>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"margin-top:40px;background:#ffffff;border:1px solid #e4e9f1;border-radius:16px;padding:28px 30px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px 28px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline;font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#43566e\"><span style=\"color:#4ade80;font:700 12px/1.4 'IBM Plex Mono',monospace\">✓<\u002Fspan>Runnable and independently buildable from day one<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#43566e\"><span style=\"color:#4ade80;font:700 12px/1.4 'IBM Plex Mono',monospace\">✓<\u002Fspan>Standard Spring Boot structure<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#43566e\"><span style=\"color:#4ade80;font:700 12px/1.4 'IBM Plex Mono',monospace\">✓<\u002Fspan>Supported contract plumbing already in place<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#43566e\"><span style=\"color:#4ade80;font:700 12px/1.4 'IBM Plex Mono',monospace\">✓<\u002Fspan>Build, run, and operational guidance<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#43566e\"><span style=\"color:#4ade80;font:700 12px/1.4 'IBM Plex Mono',monospace\">✓<\u002Fspan>Explicit places for developer-owned domain logic<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#43566e\"><span style=\"color:#4ade80;font:700 12px/1.4 'IBM Plex Mono',monospace\">✓<\u002Fspan>No EdgeForge runtime dependency<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;font:400 14.5px/1.55 'Instrument Sans',sans-serif;color:#43566e\"><span style=\"color:#4ade80;font:700 12px/1.4 'IBM Plex Mono',monospace\">✓<\u002Fspan>Compatible with normal IDE, CI/CD, review, and adopter-approved coding-assistant workflows<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #eef2f8;font:400 13px/1.65 'Instrument Sans',sans-serif;color:#64748b;text-wrap:pretty\">Independently deployable and controlled by the adopting engineering team — the generated application runs entirely outside the authoring suite.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ STAKEHOLDERS (biz, dark) ============ -->\n  <section id=\"who\" data-screen-label=\"One reviewed definition, shared across stakeholders\" style=\"display:{{ ovDisp }};position:relative;background:#0e1c30;color:#dcebfb\">\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 28px 96px\">\n      <div data-reveal=\"\" style=\"max-width:760px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#7db8ff;margin-bottom:16px\">ONE REVIEWED DEFINITION<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#ffffff;text-wrap:balance\">One reviewed definition, shared across stakeholders.<\u002Fh2>\n        <p style=\"margin:20px 0 0;max-width:640px;font:400 16px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">The same reviewed definition serves every accountable group. These are stakeholder uses of one truth — not additional views to maintain.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:44px\">\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#7db8ff;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px\">SPONSORS<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Understand scope and whether a candidate application actually fits.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#2dd4bf;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px\">PRODUCT &amp; DOMAIN OWNERS<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Review the obligations and rules the application must continue honoring.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#4ade80;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px\">ARCHITECTS<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Review boundaries, mappings, and the canonical application model.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#fbbf24;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px\">ENGINEERING<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Receive the implementation foundation and own everything domain-specific.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#818cf8;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px\">SECURITY, LEGAL &amp; COMPLIANCE<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Inspect the governance posture and the acceptance evidence.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ EVOLVE (biz, light) ============ -->\n  <section id=\"evolve\" data-screen-label=\"Designed to evolve\" style=\"display:{{ ovDisp }};position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d\">\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 28px 90px\">\n      <div data-reveal=\"\" style=\"max-width:820px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#4ade80;margin-bottom:16px\">DESIGNED TO EVOLVE<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">Designed to evolve without erasing developer work.<\u002Fh2>\n        <p style=\"margin:20px 0 0;max-width:720px;font:400 16px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">Proven CRUD maintain-over-time support refreshes generated base code while preserving developer-owned service logic. Supported additive database changes can be generated; destructive or drifted changes are stopped for review.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:28px\">\n        <span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#7db8ff;background:rgba(125,184,255,.12);border:1px solid rgba(125,184,255,.35);border-radius:100px;padding:10px 16px\">GENERATED BASE CODE REFRESHES<\u002Fspan>\n        <span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#4ade80;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);border-radius:100px;padding:10px 16px\">DEVELOPER SERVICE LOGIC PRESERVED<\u002Fspan>\n        <span style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#f87171;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);border-radius:100px;padding:10px 16px\">DESTRUCTIVE CHANGES STOPPED FOR REVIEW<\u002Fspan>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"margin-top:18px;border-left:2px solid #d9b871;padding:2px 0 2px 14px;max-width:760px;font:400 12.5px/1.65 'Instrument Sans',sans-serif;color:#64748b;text-wrap:pretty\">This maintain-over-time behavior is specific to CRUD applications today; the same regeneration behavior is not claimed for Kafka-integration or passthrough applications.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ GOVERNANCE (light) ============ -->\n  <section id=\"governance\" data-screen-label=\"Governance\" style=\"position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d\">\n    <div data-anim=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(30,58,95,.05) 1px,transparent 1.6px);background-size:32px 32px;animation:efFloat 92s linear infinite;mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:104px 28px 96px\">\n      <div data-reveal=\"\" style=\"max-width:720px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#4f46e5;margin-bottom:16px\">GOVERNANCE<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f\">Governance that reviewers can inspect.<\u002Fh2>\n        <p style=\"margin:20px 0 0;max-width:640px;font:400 16.5px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">The governed Studio workflow requires explicit review: suggestions cannot bypass acceptance or editing before export — and the posture below is stated precisely, not oversold.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:44px\">\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#2f6fed;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">HUMAN-REVIEWED INPUTS<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">In the governed Studio workflow, suggestions cannot bypass review: accepted or edited decisions are exported into the explicit manifest package that the Engine validates and generates from.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#0f766e;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">REPEATABLE, DETERMINISTIC GENERATION<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Generation is deterministic from the reviewed inputs — it succeeds repeatably, or it fails fast. No AI variability in the output.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#4f46e5;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">REVIEWABLE PROVENANCE WHERE SUPPORTED<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Manifest entries carry their origin where supported — from evidence, manually reviewed, derived, or assist-applied — exportable as review evidence.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#b91c1c;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">OPERATOR-SUPPLIED DATA STAYS ADOPTER-GOVERNED<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Committed fixtures are synthetic. Samples and documents you provide may contain sensitive data and remain governed by the adopting organization.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#b45309;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">KNOWLEDGE ASSIST OFF BY DEFAULT<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Optional evidence assistance. It never writes automatically — accepted or edited suggestions enter only through human review.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#b45309;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">NO EXTERNAL LLM CONNECTION<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Knowledge Assist searches locally indexed project evidence only. It does not connect to an external LLM provider; any future integration would be a separate, adopter-governed roadmap decision.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#15803d;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">SELF-HOSTED AUTHORING<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Authoring state is stored in your environment. EdgeForge has no hosted SaaS dependency or background phone-home; an operator may explicitly configure a remote contract fetch.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#2f6fed;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">DURABLE AUDIT · SESSION ATTRIBUTION<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Authoring and generation actions are recorded in durable audit storage with anonymous session-level attribution; identity today is signed anonymous browser sessions.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#0f766e;padding-bottom:12px;border-bottom:1px solid #eef2f8;margin-bottom:12px\">INDEPENDENT AT RUNTIME<\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Generated applications run with no EdgeForge runtime dependency — independently deployable and controlled by the adopting engineering team.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"margin-top:22px;background:#ffffff;border:1px solid #dbe3ee;border-radius:16px;padding:24px 30px;display:flex;flex-wrap:wrap;gap:16px 30px;align-items:center\">\n        <div style=\"flex:1 1 440px;min-width:0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">Deployment and identity posture — shared multi-session isolation, CSRF, durable audit with session-level attribution, and the anonymous-session note — is covered in full in the deployment &amp; identity section. Governance here focuses on deterministic generation, human approval, review evidence, and data posture.<\u002Fdiv>\n        <a href=\"#deploy\" style=\"flex:none;font:600 12.5px/1 'Instrument Sans',sans-serif;color:#2f6fed;border:1px solid rgba(47,111,237,.35);border-radius:100px;padding:11px 18px\" style-hover=\"border-color:rgba(47,111,237,.7);color:#1e3a5f\">See deployment &amp; identity posture ↓<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ DEPLOYMENT (dark) ============ -->\n  <section id=\"deploy\" data-screen-label=\"Deployment &amp; identity posture\" style=\"position:relative;overflow:hidden;background:#0e1c30;color:#dcebfb\">\n    <div data-anim=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(125,184,255,.05) 1px,transparent 1.6px);background-size:32px 32px;animation:efFloat 88s linear infinite;mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:104px 28px 96px\">\n      <div data-reveal=\"\" style=\"max-width:780px\">\n        <div style=\"display:{{ ovDisp }};font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#7db8ff;margin-bottom:16px\">DEPLOYMENT &amp; IDENTITY<\u002Fdiv>\n        <div style=\"display:{{ techDisp }};font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#7db8ff;margin-bottom:16px\">09 · DEPLOYMENT, IDENTITY &amp; TRUST BOUNDARIES<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#ffffff;text-wrap:balance\">Self-host the authoring tools. Run the generated application independently.<\u002Fh2>\n        <p style=\"margin:20px 0 0;max-width:680px;font:400 16.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Studio deploys on your infrastructure as a shared multi-session authoring service — per-session isolation ships today, and audit events are durably stored with session-level attribution. Studio stores authoring state in your environment and has no hosted SaaS dependency or background phone-home; an operator may explicitly configure a remote contract fetch. Generated applications run entirely outside the authoring suite.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:44px\">\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#7db8ff;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px\">PER-SESSION ISOLATION<\u002Fdiv>\n          <p style=\"margin:0;font:400 14px/1.65 'Instrument Sans',sans-serif;color:#c3d4ea\">Each session gets isolated projects and its own Knowledge Assist evidence workspace. Sessions never see each other’s work.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#2dd4bf;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px\">CSRF · DURABLE AUDIT<\u002Fdiv>\n          <p style=\"margin:0;font:400 14px/1.65 'Instrument Sans',sans-serif;color:#c3d4ea\">CSRF protection and durable audit storage with session-level attribution ship out of the box.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#4ade80;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px\">{{ depCardTitle }}<\u002Fdiv>\n          <p style=\"margin:0;font:400 14px/1.65 'Instrument Sans',sans-serif;color:#c3d4ea\">{{ depCardBody }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#818cf8;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px\">SELF-HOSTED VIA DOCKER<\u002Fdiv>\n          <p style=\"margin:0;font:400 14px/1.65 'Instrument Sans',sans-serif;color:#c3d4ea\">Runs on your infrastructure — no hosted SaaS, no sign-up. The authoring suite runs during design and generation; generated applications run outside it, independently.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- compact posture footnote (replaces the two caveat boxes) -->\n      <div data-reveal=\"\" data-ef-darkpanel=\"\" style=\"margin-top:32px;background:#091528;border:1px solid rgba(125,184,255,.32);border-left:4px solid #7db8ff;border-radius:14px;padding:24px 28px;box-shadow:0 20px 48px rgba(4,10,20,.35)\">\n        <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.8px;color:#8ec3ff;margin-bottom:12px\">DEPLOYMENT &amp; IDENTITY POSTURE — STATED PRECISELY<\u002Fdiv>\n        <p style=\"margin:0;max-width:920px;font:400 14.5px/1.75 'Instrument Sans',sans-serif;color:#e8f0fc;text-wrap:pretty\">Today: identity uses signed anonymous browser sessions, and audit storage is durable with anonymous session-level attribution. OIDC / proxy SSO, RBAC, and named-user audit attribution remain adopter wiring or roadmap. Shared-mode session isolation, CSRF protection, session-level audit events, and server-owned workspace roots (fail closed) are shipped and covered by the documented v4.1.0 acceptance run.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ ACCEPTANCE EVIDENCE (tech, light) ============ -->\n  <section id=\"evidence\" data-screen-label=\"Validation and acceptance evidence\" style=\"display:{{ techDisp }};position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d\">\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 28px 90px\">\n      <div data-reveal=\"\" style=\"max-width:780px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#4ade80;margin-bottom:16px\">10 · VALIDATION &amp; ACCEPTANCE EVIDENCE<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">Evidence you can inspect and re-run.<\u002Fh2>\n        <p style=\"margin:20px 0 0;max-width:680px;font:400 16px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">Contract checks verify declared contract structure and generated outputs. The documented v4.1.0 acceptance run covers the scenarios below — it is a documented acceptance run, not production certification and not continuous assurance.<\u002Fp>\n      <\u002Fdiv>\n      <!-- acceptance gate checklist -->\n      <div style=\"display:{{ techDisp }}\">\n      <div id=\"gate-panel\" data-reveal=\"\" style=\"margin-top:34px;background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px 30px;box-shadow:0 14px 34px rgba(0,0,0,.3)\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px 18px;align-items:baseline\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#4ade80\">DOCUMENTED ACCEPTANCE RUN · SUITE v4.1.0<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 'Instrument Sans',sans-serif;color:#c3d4ea\">The suite acceptance run exercised Engine and Studio flows, dedicated Knowledge Assist isolation scenarios, and strict KA-off silence — and you can run it yourself.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px 26px\">\n          <sc-for list=\"{{ gateItems }}\" as=\"g\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span style=\"{{ g.dotStyle }}\">✓<\u002Fspan>\n              <span style=\"{{ g.textStyle }}\">{{ g.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"{{ gateStampStyle }}\">\n          <div style=\"display:inline-flex;align-items:center;gap:10px;margin-top:22px;border:1px solid rgba(74,222,128,.35);background:rgba(74,222,128,.1);border-radius:100px;padding:10px 18px;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#4ade80\"><span style=\"width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e\"><\u002Fspan>v4.1.0 ACCEPTANCE PASSED · DOCUMENTED SCENARIOS<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"margin-top:16px;font:400 13.5px/1.65 'Instrument Sans',sans-serif;color:#48596f;max-width:820px;text-wrap:pretty\">Exportable review evidence and the full acceptance detail ship in the technical proof pack — request it from your EdgeForge contact.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ROADMAP (light) ============ -->\n  <section id=\"roadmap\" data-screen-label=\"Today vs vision\" style=\"position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d\">\n    <div data-anim=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(30,58,95,.05) 1px,transparent 1.6px);background-size:32px 32px;animation:efFloat 95s linear infinite;mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:104px 28px 90px\">\n      <div data-reveal=\"\" style=\"max-width:720px\">\n        <div style=\"display:{{ ovDisp }};font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#b45309;margin-bottom:16px\">PROVEN TODAY<\u002Fdiv>\n        <div style=\"display:{{ techDisp }};font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#b45309;margin-bottom:16px\">11 · KNOWN BOUNDARIES &amp; ROADMAP<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">Proven today. Explicit about what comes next.<\u002Fh2>\n        <p style=\"margin:20px 0 0;max-width:680px;font:400 16px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">Three honest categories: what is available on current main today, what has actually been verified and how deeply, and what remains your responsibility or is not built yet. If a claim matters to your review, ask us to demo it live.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:44px\">\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-top:3px solid #22c55e;border-radius:16px;padding:28px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n          <div style=\"font:600 10.5px\u002F1.5 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#15803d;margin-bottom:18px\">AVAILABLE ON CURRENT MAIN &middot; v5 CANDIDATE<\u002Fdiv>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:11px;font:400 14px\u002F1.55 'Instrument Sans',sans-serif;color:#43566e\">\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#15803d;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Three archetypes — CRUD &middot; Kafka integration &middot; synchronous passthrough\u002Fmediation — across REST, fixed-width, CSV, XML\u002FXSD, bounded SOAP and staging handoffs in documented directions<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#15803d;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Deterministic generate-or-fail-fast into standalone Spring Boot repositories, no EdgeForge runtime dependency. CRUD maintain-over-time preserves developer-owned logic and stops destructive changes<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#15803d;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Self-hosted Studio via Docker — app-definition.yaml manifest 2.0, refreshed UX as sole presentation, local stdio-only Knowledge Server, Knowledge Assist off by default<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#15803d;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Studio security baseline — durable audit storage in shared mode with anonymous session-level attribution, bounded contract fetch, request\u002Fupload and resource controls<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#15803d;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Hardened generated baseline — security headers on every response, bounded CRUD pagination, Kafka actuator health-only. Passthrough enforces inbound required fields and maximum string length only<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#15803d;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Staging handoffs — opt-in run identity, resume-only restart, idempotent per-run writes; durable across process replacement on PostgreSQL, same-process only on H2<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#15803d;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Three synthetic domain sample packs — financial services, healthcare\u002Fpayer, insurance<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-top:3px solid #2f6fed;border-radius:16px;padding:28px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n          <div style=\"font:600 10.5px\u002F1.5 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2f6fed;margin-bottom:18px\">VERIFIED EVIDENCE<\u002Fdiv>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:11px;font:400 14px\u002F1.55 'Instrument Sans',sans-serif;color:#43566e\">\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2f6fed;font-family:'IBM Plex Mono',monospace\">✓<\u002Fspan>The documented v4.1.0 suite acceptance run covered those capabilities in their documented directions<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2f6fed;font-family:'IBM Plex Mono',monospace\">✓<\u002Fspan>A pinned cross-repository proof for the sample packs — authoring, export, generation, build, independence. Generated-app runtime is outside it<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2f6fed;font-family:'IBM Plex Mono',monospace\">✓<\u002Fspan>The current-main v5 candidate as a whole still awaits a coordinated suite acceptance run<\u002Fli>\n          <\u002Ful>\n          <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #eef2f8;font:400 12px\u002F1.6 'Instrument Sans',sans-serif;color:#64748b;text-wrap:pretty\">A documented acceptance run for these scenarios — not production certification, and not continuous assurance.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-top:3px solid #f5a623;border-radius:16px;padding:28px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n          <div style=\"font:600 10.5px\u002F1.5 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#b45309;margin-bottom:18px\">BOUNDARIES &amp; NEXT<\u002Fdiv>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:11px;font:400 14px\u002F1.55 'Instrument Sans',sans-serif;color:#43566e\">\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#b45309;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Generated applications must sit behind an authenticated TLS gateway, with no direct application-port access. Object, tenant and row authorization and rate limiting remain adopter-owned<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#b45309;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Studio shared mode is single-replica; signed anonymous sessions provide isolation, not authentication<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#b45309;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>OIDC \u002F proxy SSO, RBAC, and named-user audit attribution<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#b45309;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Richer SOAP, and further connectors — Avro \u002F Schema Registry &middot; MQ \u002F JMS &middot; SFTP \u002F object store<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#b45309;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Legacy-source candidate extraction — draft-only, never writing manifests directly<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#b45309;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Knowledge Assist review hardening, gated on the production data-handling decision. No AI or provider integration ships today; any would need separate adopter-governed approval<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline\">\n        <span style=\"font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#15803d\">ACCEPTANCE EVIDENCE PACK ·<\u002Fspan>\n        <span style=\"font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">Available from either view — request it from your EdgeForge contact.<span style=\"display:{{ techInline }}\"> Or inspect the <a href=\"#evidence\">acceptance evidence section<\u002Fa> above.<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ TECH FIT ASSESSMENT (tech, light) ============ -->\n  <section id=\"fitcheck\" data-screen-label=\"Technical fit assessment\" style=\"display:{{ techDisp }};position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d;border-top:1px solid #e4e9f1\">\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 28px 90px\">\n      <div data-reveal=\"\" style=\"max-width:760px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#7db8ff;margin-bottom:16px\">12 · TECHNICAL FIT ASSESSMENT<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">Six questions before you commit a candidate.<\u002Fh2>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:40px\">\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px;display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font:700 13px/1 'IBM Plex Mono',monospace;color:#7db8ff;flex:none\">Q1<\u002Fspan>\n          <span style=\"font:500 15px/1.55 'Instrument Sans',sans-serif;color:#1e3a5f;text-wrap:pretty\">Can the application’s edges be represented by the supported contract families and directions?<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px;display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font:700 13px/1 'IBM Plex Mono',monospace;color:#7db8ff;flex:none\">Q2<\u002Fspan>\n          <span style=\"font:500 15px/1.55 'Instrument Sans',sans-serif;color:#1e3a5f;text-wrap:pretty\">Can mappings into the internal application model be explicitly reviewed?<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px;display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font:700 13px/1 'IBM Plex Mono',monospace;color:#7db8ff;flex:none\">Q3<\u002Fspan>\n          <span style=\"font:500 15px/1.55 'Instrument Sans',sans-serif;color:#1e3a5f;text-wrap:pretty\">Does the intended application fit CRUD, Kafka integration, or synchronous passthrough/mediation?<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px;display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font:700 13px/1 'IBM Plex Mono',monospace;color:#7db8ff;flex:none\">Q4<\u002Fspan>\n          <span style=\"font:500 15px/1.55 'Instrument Sans',sans-serif;color:#1e3a5f;text-wrap:pretty\">Which product-specific behavior remains for developers?<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px;display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font:700 13px/1 'IBM Plex Mono',monospace;color:#7db8ff;flex:none\">Q5<\u002Fspan>\n          <span style=\"font:500 15px/1.55 'Instrument Sans',sans-serif;color:#1e3a5f;text-wrap:pretty\">Are unsupported protocols, operation semantics, or industry semantics required?<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 24px;display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font:700 13px/1 'IBM Plex Mono',monospace;color:#7db8ff;flex:none\">Q6<\u002Fspan>\n          <span style=\"font:500 15px/1.55 'Instrument Sans',sans-serif;color:#1e3a5f;text-wrap:pretty\">Does the output align with your Java 17/21, Spring Boot, PostgreSQL/H2, Flyway, Docker, and platform standards?<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CTA / FOOTER (dark) ============ -->\n  <section id=\"cta\" data-screen-label=\"CTA and footer\" style=\"background:linear-gradient(180deg,#0e1c30 0%,#122a49 100%);color:#dcebfb;border-top:1px solid rgba(255,255,255,.07)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:100px 28px 0;text-align:center\">\n      <sc-if value=\"{{ isBizFlag }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-reveal=\"\">\n          <h2 style=\"margin:0 auto;max-width:760px;font:700 clamp(32px,4.2vw,54px)/1.1 'Instrument Sans',sans-serif;letter-spacing:-1.8px;color:#ffffff;text-wrap:balance\">Start with one application whose surrounding obligations matter.<\u002Fh2>\n          <p style=\"margin:22px auto 0;max-width:660px;font:400 16.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Assess whether its APIs, schemas, files, table handoffs, messages, mappings, and rules can become an explicit reviewed modernization scope.<\u002Fp>\n          <div style=\"display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap\">\n            <a href=\"#fit\" style=\"display:inline-flex;align-items:center;gap:8px;background:#2f6fed;color:#ffffff;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px;box-shadow:0 8px 24px rgba(47,111,237,.35);border:none;cursor:pointer\" style-hover=\"background:#1d4ed8;color:#ffffff\">Assess a candidate application<\u002Fa>\n            <button type=\"button\" sc-camel-on-click=\"{{ setTechnical }}\" style=\"display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.06);color:#ffffff;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,.5);color:#ffffff\" style-focus=\"outline:2px solid #7db8ff;outline-offset:2px\">Open Technical view<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:26px auto 0;font:500 13px/1.6 'Instrument Sans',sans-serif;color:#7f95b5\">Private adopter preview — ask your EdgeForge contact for the onboarding bundle.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTechFlag }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-reveal=\"\">\n          <h2 style=\"margin:0 auto;max-width:760px;font:700 clamp(32px,4.2vw,54px)/1.1 'Instrument Sans',sans-serif;letter-spacing:-1.8px;color:#ffffff;text-wrap:balance\">Test EdgeForge against a representative contract set.<\u002Fh2>\n          <p style=\"margin:22px auto 0;max-width:660px;font:400 16.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Choose one application slice with representative upstream and downstream obligations. Author and approve its manifest, generate and build the application, exercise the supported contracts, and inspect the validation, regeneration, and evidence outputs.<\u002Fp>\n          <div style=\"display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap\">\n            <a href=\"#how\" style=\"display:inline-flex;align-items:center;gap:8px;background:#2f6fed;color:#ffffff;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px;box-shadow:0 8px 24px rgba(47,111,237,.35);border:none;cursor:pointer\" style-hover=\"background:#1d4ed8;color:#ffffff\">Run the evaluation path<\u002Fa>\n            <a href=\"#roadmap\" style=\"display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.06);color:#ffffff;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,.5);color:#ffffff\">Review limitations and roadmap<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:inline-flex;flex-direction:column;gap:0;margin-top:34px;background:rgba(8,15,28,.85);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px 26px;text-align:left\">\n            <span style=\"font:500 13.5px/1.8 'IBM Plex Mono',monospace;color:#c8d7ec\"><span style=\"color:#6d82a3\">$<\u002Fspan> docker compose up studio<\u002Fspan>\n            <span style=\"font:400 12px/1.8 'IBM Plex Mono',monospace;color:#6d82a3\"># Studio → http://localhost:8083 · self-hosted · no sign-up<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:26px auto 0;font:500 13px/1.6 'Instrument Sans',sans-serif;color:#7f95b5\">Private adopter preview — ask your EdgeForge contact for the onboarding bundle.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <footer style=\"margin-top:84px;border-top:1px solid rgba(255,255,255,.08);padding:30px 0 36px;display:flex;flex-wrap:wrap;gap:14px 30px;align-items:center;justify-content:space-between;text-align:left\">\n        <div style=\"font:800 16px/1 'Instrument Sans',sans-serif;letter-spacing:-.3px;color:#ffffff\">Edge<span style=\"color:#7db8ff\">Forge<\u002Fspan><\u002Fdiv>\n        <div style=\"font:400 11.5px/1.6 'IBM Plex Mono',monospace;color:#6d82a3\">Suite v4.1.0 · private adopter preview<\u002Fdiv>\n        <div style=\"font:400 11.5px/1.6 'Instrument Sans',sans-serif;color:#6d82a3\">Website examples are synthetic · not a public offering · July 2026<\u002Fdiv>\n      <\u002Ffooter>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroFx&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;edges&quot;,&quot;options&quot;:[&quot;edges&quot;,&quot;panels&quot;,&quot;sweep&quot;,&quot;off&quot;],&quot;tsType&quot;:&quot;'edges' | 'panels' | 'sweep' | 'off'&quot;,&quot;section&quot;:&quot;Hero background&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;heroSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:3,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: 'business', modeAnnounce: '', toast: '', hoStep: 0, hoPlaying: false, menuOpen: false, di: 0, dlFading: false, fi: 0, showC: true, showO: false, activeNode: null, traceStep: -1, tracePlaying: false, traceOpen: false, kaOn: false, wizStep: 0, archTab: 'crud', regenShown: true, gateShown: true };\n\n  get FAMILIES() {\n    const e = this.DP.eng;\n    return [\n      {\n        name: 'Fixed-width', mono: 'FW', accent: '#4ade80',\n        contractFile: e.fw.file, outputFile: e.fw.out + '.java',\n        both: 'fixed-width · both directions generated: parser (ingest) + writer (EOD output)',\n        contract: [\n          { c: 'cm', t: '# ' + e.fw.data + ' · fixed-width' },\n          { t: e.fw.idCol + '   pos 1-36    char' },\n          { t: e.fw.amtCol + '   pos 37-52   dec(13,2)' },\n          { t: 'STATUS       pos 53-54   char' },\n          { t: e.fw.tsCol + '   pos 55-62   yyyymmdd' }\n        ],\n        output: [\n          { c: 'cm', t: '// generated · downstream writer' },\n          { c: 'cm', t: '// (parser generated for ingest too)' },\n          { c: 'k',  t: '@Component' },\n          { t: 'class ' + e.fw.out + ' {' },\n          { t: '  String write(' + e.fw.rec + ' r) {' },\n          { t: '    return pad(r.' + e.fw.idField + '(), 36)' },\n          { t: '      + dec(r.' + e.fw.amtField + '(), 13, 2)' },\n          { t: '      + pad(r.status(), 2) + …;' },\n          { t: '  }' },\n          { t: '}' }\n        ]\n      },\n      {\n        name: 'CSV feed', mono: 'CSV', accent: '#818cf8',\n        contractFile: e.csv.file, outputFile: e.csv.out + '.java',\n        both: 'CSV · both directions generated: reader (inbound feed) + writer (outbound feed)',\n        contract: [\n          { c: 'cm', t: '# ' + e.csv.file + ' · daily feed' },\n          { c: 'k',  t: e.csv.hdr },\n          { t: e.csv.rows[0] },\n          { t: e.csv.rows[1] },\n          { t: e.csv.rows[2] }\n        ],\n        output: [\n          { c: 'cm', t: '// generated · downstream writer' },\n          { c: 'cm', t: '// (reader generated for ingest too)' },\n          { c: 'k',  t: '@Component' },\n          { t: 'class ' + e.csv.out + ' {' },\n          { t: '  FlatFileItemWriter<' + e.csv.rec + '>' },\n          { t: '      writer() {' },\n          { t: '    …names(' + e.csv.outCols.split('|')[0] },\n          { t: '        ' + e.csv.outCols.split('|')[1] + ');' },\n          { t: '  }' },\n          { t: '}' }\n        ]\n      },\n      {\n        name: 'XML / XSD', mono: 'XML', accent: '#fbbf24',\n        contractFile: e.xml.file, outputFile: e.xml.out + '.java',\n        both: 'XML/XSD · both directions generated: parser (ingest) + serializer (output)',\n        contract: [\n          { c: 'cm', t: '<!-- ' + e.xml.file + ' -->' },\n          { c: 'k',  t: '<xs:element name=\"' + e.xml.root + '\">' },\n          { t: '  <xs:sequence>' },\n          { t: '    <xs:element name=\"' + e.xml.f1 + '\"' },\n          { t: '        type=\"xs:string\"/>' },\n          { t: '    <xs:element name=\"' + e.xml.f2 + '\"' },\n          { t: '        type=\"' + e.xml.f2t + '\"/>' },\n          { t: '  <\u002Fxs:sequence>' }\n        ],\n        output: [\n          { c: 'cm', t: '// generated · downstream serializer' },\n          { c: 'cm', t: '// (parser generated for ingest too)' },\n          { c: 'k',  t: '@Component' },\n          { t: 'class ' + e.xml.out + ' {' },\n          { t: '  String serialize(' + e.xml.root + ' p) {' },\n          { t: '    return marshaller.marshal(' },\n          { t: '        toDocument(p));' },\n          { t: '  }' },\n          { t: '}' }\n        ]\n      },\n      {\n        name: 'SOAP / WSDL', mono: 'SOAP', accent: '#7db8ff',\n        contractFile: e.soap.file, outputFile: e.soap.out + '.java',\n        both: 'SOAP · bounded canonical, both directions: a bounded inbound read endpoint + an outbound SOAP client',\n        contract: [\n          { c: 'cm', t: '<!-- ' + e.soap.edge + ' -->' },\n          { c: 'k',  t: '<wsdl:operation name=\"' + e.soap.op + '\">' },\n          { t: '  <wsdl:input' },\n          { t: '    message=\"tns:' + e.soap.op + 'Request\"/>' },\n          { t: '  <wsdl:output' },\n          { t: '    message=\"tns:' + e.soap.op + 'Response\"/>' },\n          { c: 'k',  t: '<\u002Fwsdl:operation>' }\n

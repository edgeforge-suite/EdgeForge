der-radius:12px;padding:13px 15px\">\n                    <div style=\"font:600 9.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#1e3a5f;margin-bottom:5px\">REPLACED WITH<\u002Fdiv>\n                    <div style=\"font:650 14px/1.4 'Instrument Sans',sans-serif;color:#1e3a5f\">EdgeForge-generated standalone application<\u002Fdiv>\n                    <div style=\"margin-top:5px;font:400 11.5px/1.55 'Instrument Sans',sans-serif;color:#475569\">generated from the approved definition · human-reviewed · runs without EdgeForge<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div data-dl-eco-arrow=\"\" aria-hidden=\"true\" style=\"align-self:center;justify-self:center;color:#0f766e;font:600 17px/1 'IBM Plex Mono',monospace\">→<\u002Fdiv>\n                <div style=\"min-width:0;background:rgba(15,118,110,.04);border:1px solid rgba(15,118,110,.25);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"font:600 9.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#0f766e\">DOWNSTREAM SYSTEMS · UNCHANGED<\u002Fdiv>\n                  <sc-for list=\"{{ ecoDown }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"background:#ffffff;border:1px solid #dde5ef;border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:6px\">\n                    <span style=\"font:600 12.5px/1.4 'Instrument Sans',sans-serif;color:#1e3a5f\">{{ s.t }}<\u002Fspan>\n                    <span style=\"align-self:flex-start;font:600 8.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.8px;color:#43566e;background:#eef2f8;border:1px solid #dde5ef;border-radius:5px;padding:3px 7px\">{{ s.b }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;padding-top:12px;border-top:1px solid #eef2f8;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline\">\n              <span style=\"font:400 12.5px/1.6 'Instrument Sans',sans-serif;color:#475569\">Different business vocabulary — the same reviewed obligations, repeatable generation, and independent delivery.<\u002Fspan>\n              <span style=\"display:{{ techDisp }};font:500 10.5px/1.6 'IBM Plex Mono',monospace;color:#64748b\">DOMAIN SELECTION CHANGES THE EXAMPLES — NOT THE SUPPORTED FAMILY SET OR ITS DIRECTIONS: REST (INBOUND) · SOAP (BOUNDED CANONICAL) · XML/XSD · FIXED-WIDTH / CSV · STAGING HANDOFFS (DOWNSTREAM) · KAFKA (SHAPE)<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ ovDisp }};margin-top:12px;border-left:2px solid #d9b871;padding:2px 0 2px 14px;max-width:860px;font:400 12.5px/1.65 'Instrument Sans',sans-serif;color:#64748b;text-wrap:pretty\">Illustrative ecosystem only. EdgeForge support is defined by its proven generic contract families and archetypes; no native industry-specific protocol semantics are implied.<\u002Fdiv>\n        <div style=\"display:{{ techDisp }};margin-top:12px;border-left:2px solid #d9b871;padding:2px 0 2px 14px;max-width:860px;font:400 12.5px/1.65 'Instrument Sans',sans-serif;color:#64748b;text-wrap:pretty\">Illustrative mappings only. EdgeForge support is defined by its proven generic contract families and shipped archetypes; no additional industry-specific protocol or semantic support is implied.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- audience fast-path -->\n      <div data-reveal=\"\" style=\"margin-top:48px;display:{{ bizFlex }};gap:10px 22px;justify-content:center;flex-wrap:wrap;align-items:baseline;font:500 13px/1 'Instrument Sans',sans-serif\">\n        <span style=\"color:#475569\">Jump to your role:<\u002Fspan>\n        <a href=\"#who\">For sponsors<\u002Fa>\n        <a href=\"#who\">For domain owners<\u002Fa>\n        <a href=\"#receives\">For engineering<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ WHERE IT FITS (biz, light) ============ -->\n  <section id=\"fit\" data-screen-label=\"Where EdgeForge fits\" style=\"display:{{ ovDisp }};position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d;border-top:1px solid #e4e9f1\">\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 28px 96px\">\n      <div data-reveal=\"\" style=\"max-width:760px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#2dd4bf;margin-bottom:16px\">WHERE IT FITS<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">Where EdgeForge fits — and where it does not.<\u002Fh2>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:40px\">\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-top:3px solid #2dd4bf;border-radius:16px;padding:28px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf;margin-bottom:18px\">A GOOD CANDIDATE HAS<\u002Fdiv>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:11px;font:400 14px/1.55 'Instrument Sans',sans-serif;color:#43566e\">\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>One application or a well-defined service slice<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Meaningful surrounding interface and operational obligations<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Contracts and mappings people can explicitly review<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>A standalone Spring Boot target<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">■<\u002Fspan>Domain owners available to review rules and remaining behavior<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-top:3px solid #fbbf24;border-radius:16px;padding:28px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#fbbf24;margin-bottom:18px\">NOT POSITIONED AS<\u002Fdiv>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:11px;font:400 14px/1.55 'Instrument Sans',sans-serif;color:#43566e\">\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Automatic discovery of every undocumented business behavior<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>One-click replacement of an enterprise core<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>A completed business implementation<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Arbitrary protocol support<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Automated production migration or cutover<\u002Fli>\n            <li style=\"display:flex;gap:10px\"><span style=\"color:#fbbf24;font-family:'IBM Plex Mono',monospace\">□<\u002Fspan>Native industry semantics inferred from the illustrative examples<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ HOW IT WORKS (light) ============ -->\n  <section id=\"how\" data-screen-label=\"How it works\" style=\"position:relative;overflow:hidden;background:#0e1c30;color:#dcebfb\">\n    <div data-anim=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(125,184,255,.05) 1px,transparent 1.6px);background-size:32px 32px;animation:efFloat 85s linear infinite;mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 100% 82% at 50% 40%,#000,transparent 78%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:104px 28px 100px\">\n      <div data-reveal=\"\" style=\"display:{{ ovDisp }}\">\n        <div style=\"max-width:760px\">\n          <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#2dd4bf;margin-bottom:14px\">FROM REVIEWED OBLIGATIONS<\u002Fdiv>          <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#ffffff;text-wrap:balance\">From reviewed obligations to an engineering starting point.<\u002Fh2>\n          <p style=\"margin:20px 0 0;max-width:640px;font:400 16.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Four plain steps — and a person approves everything before anything is generated.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div style=\"max-width:720px\">\n          <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#2dd4bf;margin-bottom:14px\">THE GENERATION FLOW<\u002Fdiv>          <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#ffffff\">Author. Generate. Prove.<\u002Fh2>\n          <p style=\"margin:20px 0 0;max-width:640px;font:400 16.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Studio authors both sides of the edge, the Engine generates and regenerates, and the suite backs its claims with acceptance evidence — Knowledge Assist is an optional evidence sidecar. One boundary holds: a human approves everything before anything is generated.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ ovDisp }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:44px\">\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n            <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf;margin-bottom:14px\">STEP 01<\u002Fdiv>\n            <div style=\"font:600 16.5px/1.45 'Instrument Sans',sans-serif;letter-spacing:-.2px;color:#eaf1fb;text-wrap:pretty\">Document what the application receives and owes.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n            <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf;margin-bottom:14px\">STEP 02<\u002Fdiv>\n            <div style=\"font:600 16.5px/1.45 'Instrument Sans',sans-serif;letter-spacing:-.2px;color:#eaf1fb;text-wrap:pretty\">Review mappings, rules, and evidence with accountable people.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n            <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf;margin-bottom:14px\">STEP 03<\u002Fdiv>\n            <div style=\"font:600 16.5px/1.45 'Instrument Sans',sans-serif;letter-spacing:-.2px;color:#eaf1fb;text-wrap:pretty\">Generate a repeatable standalone application foundation.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px\">\n            <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf;margin-bottom:14px\">STEP 04<\u002Fdiv>\n            <div style=\"font:600 16.5px/1.45 'Instrument Sans',sans-serif;letter-spacing:-.2px;color:#eaf1fb;text-wrap:pretty\">Validate and evolve it against the declared obligations.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;max-width:880px;border:1px solid rgba(129,140,248,.25);border-left:3px solid #818cf8;background:rgba(129,140,248,.06);border-radius:12px;padding:16px 20px\">\n          <span style=\"font:600 10px/1.7 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#818cf8\">OPTIONAL · KNOWLEDGE ASSIST · <\u002Fspan>\n          <span style=\"font:400 13px/1.7 'Instrument Sans',sans-serif;color:#c3d4ea\">Knowledge Assist searches locally indexed project evidence and presents cited suggestions for human review. It is optional, off by default, and does not connect to an external LLM provider.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n\n\n      <div style=\"display:{{ techDisp }}\">\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:44px\">\n        <div data-reveal=\"\" sc-camel-on-mouse-enter=\"{{ enterStudio }}\" sc-camel-on-mouse-leave=\"{{ leaveNode }}\" style=\"flex:1 1 240px;min-width:0;background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:26px 26px 22px;cursor:default\" style-hover=\"border-color:rgba(255,255,255,.22);box-shadow:0 18px 44px rgba(0,0,0,.4);transition:all .35s ease\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(125,184,255,.16);color:#7db8ff;display:inline-flex;align-items:center;justify-content:center;font:600 10px/1 'IBM Plex Mono',monospace\">ST<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#7db8ff\">STUDIO · AUTHOR<\u002Fspan><\u002Fdiv>\n          <h3 style=\"margin:16px 0 8px;font:650 21px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.5px;color:#ffffff\">Where humans govern<\u002Fh3>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">The review boundary — for both sides of the edge. Author upstream contracts and downstream obligations; only what an architect approves becomes the manifest.<\u002Fp>\n          <div style=\"{{ studioDetail }}\">\n            <ul style=\"margin:16px 0 0;padding:0;list-style:none;display:grid;gap:9px;font:400 13px/1.5 'Instrument Sans',sans-serif;color:#c3d4ea\">\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#7db8ff;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Guided authoring wizard — upstream, downstream + staging handoffs<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#7db8ff;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Accept / edit / reject every suggestion<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#7db8ff;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Evidence drawer with citations<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#7db8ff;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Decision ledger · reviewable provenance where supported<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#7db8ff;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Manifest export · versioned and reviewable<\u002Fli>\n            <\u002Ful>\n            <div style=\"margin-top:14px;font:500 11px/1.5 'IBM Plex Mono',monospace;color:#8ea3c2\">Two modes: local single-user (default) · shared multi-session, per-session isolation.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" sc-camel-on-mouse-enter=\"{{ enterEngine }}\" sc-camel-on-mouse-leave=\"{{ leaveNode }}\" style=\"flex:1 1 240px;min-width:0;background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:26px 26px 22px;cursor:default\" style-hover=\"border-color:rgba(255,255,255,.22);box-shadow:0 18px 44px rgba(0,0,0,.4);transition:all .35s ease\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(45,212,191,.16);color:#2dd4bf;display:inline-flex;align-items:center;justify-content:center;font:600 10px/1 'IBM Plex Mono',monospace\">EN<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">ENGINE · GENERATE<\u002Fspan><\u002Fdiv>\n          <h3 style=\"margin:16px 0 8px;font:650 21px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.5px;color:#ffffff\">A compiler, not a copilot<\u002Fh3>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Consumes only the versioned manifest package. Generation is deterministic — or it fails fast. For CRUD apps, regeneration preserves developer-owned service logic while refreshing generated base code.<\u002Fp>\n          <div style=\"{{ engineDetail }}\">\n            <ul style=\"margin:16px 0 0;padding:0;list-style:none;display:grid;gap:9px;font:400 13px/1.5 'Instrument Sans',sans-serif;color:#c3d4ea\">\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Manifest + contract validation<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Canonical, interface-independent model<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Archetypes: CRUD · kafka-integration · passthrough-router<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Emitters: Java 17/21 · H2/PostgreSQL · Flyway · Docker<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#2dd4bf;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>CRUD regenerate-safe: developer service layer preserved · additive Flyway · destructive fails closed<\u002Fli>\n            <\u002Ful>\n            <div style=\"margin-top:14px;font:500 11px/1.5 'IBM Plex Mono',monospace;color:#8ea3c2\">Deterministic from the complete reviewed inputs and applicable package state — or generation fails fast.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" sc-camel-on-mouse-enter=\"{{ enterProve }}\" sc-camel-on-mouse-leave=\"{{ leaveNode }}\" style=\"flex:1 1 240px;min-width:0;background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:26px 26px 22px;cursor:default\" style-hover=\"border-color:rgba(255,255,255,.22);box-shadow:0 18px 44px rgba(0,0,0,.4);transition:all .35s ease\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(74,222,128,.16);color:#4ade80;display:inline-flex;align-items:center;justify-content:center;font:600 10px/1 'IBM Plex Mono',monospace\">PR<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#4ade80\">SUITE · PROVE<\u002Fspan><\u002Fdiv>\n          <h3 style=\"margin:16px 0 8px;font:650 21px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.5px;color:#ffffff\">Evidence, not assurances<\u002Fh3>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Core product claims are backed by proof artifacts — exportable review evidence and an acceptance gate you can run yourself.<\u002Fp>\n          <div style=\"{{ proveDetail }}\">\n            <ul style=\"margin:16px 0 0;padding:0;list-style:none;display:grid;gap:9px;font:400 13px/1.5 'Instrument Sans',sans-serif;color:#c3d4ea\">\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#4ade80;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Exportable review evidence — provenance + citations<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#4ade80;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>End-to-end acceptance gate — Engine and Studio flows, Knowledge Assist isolation, and strict KA-off silence<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#4ade80;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Contract checks — declared contract structure + generated outputs<\u002Fli>\n              <li style=\"display:flex;gap:9px\"><span style=\"color:#4ade80;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Optional local test utility — exercise generated apps locally<\u002Fli>\n            <\u002Ful>\n            <div style=\"margin-top:14px;font:500 11px/1.5 'IBM Plex Mono',monospace;color:#8ea3c2\">Proof is a suite capability — run the gate before you trust the claim.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n      <div data-howband=\"\">\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div style=\"max-width:780px;margin-top:64px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">02 · CANONICAL MAPPINGS &amp; THE REVIEWED MANIFEST<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(22px,2.7vw,30px)/1.18 'Instrument Sans',sans-serif;letter-spacing:-.7px;color:#ffffff;text-wrap:balance\">Every edge maps into one canonical application model.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Mappings from each contract into the internal model are explicit and reviewed in Studio. The versioned manifest package, comprising the application definition and its referenced artifacts, is the authoritative generation input, with reviewable provenance where supported. Greenfield generation is deterministic for the same reviewed manifest package and Engine version; regeneration is deterministic against that package plus committed baseline/package state and preserved developer-owned files.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:20px\">\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px\"><div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#7db8ff;margin-bottom:8px\">CANONICAL MODEL<\u002Fdiv><div style=\"font:400 12.5px/1.55 'Instrument Sans',sans-serif;color:#c3d4ea\">Interface-independent application model; every supported edge maps into it, never edge-to-edge.<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px\"><div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#2dd4bf;margin-bottom:8px\">REVIEWED MAPPINGS<\u002Fdiv><div style=\"font:400 12.5px/1.55 'Instrument Sans',sans-serif;color:#c3d4ea\">Field mappings, rules, and handoffs are accepted, edited, or rejected by a person before they enter the manifest.<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px\"><div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#4ade80;margin-bottom:8px\">VERSIONED MANIFEST<\u002Fdiv><div style=\"font:400 12.5px/1.55 'Instrument Sans',sans-serif;color:#c3d4ea\">A readable, diffable artifact — the authoritative generation input your reviewers can inspect.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div style=\"max-width:780px;margin-top:64px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">03 · GENERATED APPLICATION SHAPES<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(22px,2.7vw,30px)/1.18 'Instrument Sans',sans-serif;letter-spacing:-.7px;color:#ffffff;text-wrap:balance\">Three shipped archetypes.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">CRUD, Kafka integration, and synchronous passthrough/mediation. The emitted shape follows the reviewed manifest.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n      <!-- PANE: archetypes -->\n      \n      <div style=\"margin-top:26px;background:#f4f1e9;border:1px solid #d7d1c6;border-radius:16px;padding:24px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center\">\n          <span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#475569;margin-right:4px\">ARCHETYPE<\u002Fspan>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ archTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ t.click }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline\">\n          <h3 style=\"margin:0;font:650 19px/1.25 'Instrument Sans',sans-serif;letter-spacing:-.3px;color:#1e3a5f\">{{ archTitle }}<\u002Fh3>\n          <p style=\"margin:0;flex:1 1 320px;min-width:0;font:400 13.5px/1.55 'Instrument Sans',sans-serif;color:#475569\">{{ archDesc }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"{{ archWrapStyle }}\">\n          <sc-for list=\"{{ archNodes }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"display:contents\">\n              <sc-if value=\"{{ a.showArrow }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"{{ a.arrowStyle }}\">{{ a.arrow }}<\u002Fdiv><\u002Fsc-if>\n              <div style=\"{{ a.boxStyle }}\">\n                <div style=\"font:600 13.5px/1.2 'Instrument Sans',sans-serif;color:#1e3a5f\">{{ a.name }}<\u002Fdiv>\n                <div style=\"margin-top:5px;font:400 11.5px/1.4 'IBM Plex Mono',monospace;color:#475569\">{{ a.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <\u002Fdiv>\n      <div data-howband=\"\">\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div style=\"max-width:780px;margin-top:64px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">04 · STUDIO AUTHORING &amp; OPTIONAL EVIDENCE ASSISTANCE<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(22px,2.7vw,30px)/1.18 'Instrument Sans',sans-serif;letter-spacing:-.7px;color:#ffffff;text-wrap:balance\">Authoring is a review activity.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">The wizard walks both sides of the edge; Knowledge Assist is an optional, off-by-default evidence sidecar with cited suggestions.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- KS sidecar (light) · Technical only -->\n      <div style=\"display:{{ techDisp }}\">\n      <div data-reveal=\"\" style=\"margin-top:16px;background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px 26px;display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-start\">\n        <div style=\"flex:1 1 340px;min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(129,140,248,.18);color:#818cf8;display:inline-flex;align-items:center;justify-content:center;font:600 10px/1 'IBM Plex Mono',monospace\">KA<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#818cf8\">KNOWLEDGE ASSIST · OPTIONAL EVIDENCE SIDECAR<\u002Fspan><\u002Fdiv>\n          <h3 style=\"margin:14px 0 8px;font:650 19px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.4px;color:#ffffff\">Evidence assistance, on demand<\u002Fh3>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea\">Knowledge Assist (KA) is optional evidence assistance, off by default. When enabled, it searches indexed project evidence and presents cited suggestions for human review. It does not connect to any external LLM provider.<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"flex:1 1 340px;min-width:0;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px 24px;font:400 13px/1.5 'Instrument Sans',sans-serif;color:#c3d4ea;align-self:center\">\n          <li style=\"display:flex;gap:9px\"><span style=\"color:#818cf8;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Project evidence index<\u002Fli>\n          <li style=\"display:flex;gap:9px\"><span style=\"color:#818cf8;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Local evidence search<\u002Fli>\n          <li style=\"display:flex;gap:9px\"><span style=\"color:#818cf8;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Cited suggestions for review<\u002Fli>\n          <li style=\"display:flex;gap:9px\"><span style=\"color:#818cf8;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan>Exportable review evidence<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n\n      <div style=\"margin-top:26px;font:400 12px/1.5 'Instrument Sans',sans-serif;color:#8ea3c2\">Illustrative — step names and order may differ from the live Studio wizard.<\u002Fdiv>\n      <div style=\"margin-top:10px;background:#f7f4ec;border:1px solid #cfc7b6;border-radius:16px;overflow:hidden;box-shadow:0 18px 44px rgba(30,58,95,.08)\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #d8d1c0;background:#ebe6d8\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:#cbc3b0\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:50%;background:#cbc3b0\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:50%;background:#cbc3b0\"><\u002Fspan>\n          <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;color:#475569;margin-left:8px\">Studio · authoring wizard · step {{ wizNum }} of 8<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#475569\">SYNTHETIC DATA<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap\">\n          <div style=\"flex:0 1 250px;min-width:210px;border-right:1px solid #d8d1c0;padding:20px 0;background:#ebe6d8\">\n            <div style=\"display:grid;gap:2px;font:500 12.5px/1 'Instrument Sans',sans-serif\">\n              <sc-for list=\"{{ wizTabs }}\" as=\"w\" hint-placeholder-count=\"8\">\n                <div sc-camel-on-click=\"{{ w.click }}\" style=\"{{ w.style }}\"><span style=\"{{ w.numStyle }}\">{{ w.num }}<\u002Fspan>{{ w.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 420px;min-width:0;padding:24px 26px;background:#fffdf8\">\n            <div style=\"{{ wizPane1Style }}\">\n            <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n              <h4 style=\"margin:0;font:650 16px/1.2 'Instrument Sans',sans-serif;color:#1e3a5f\">{{ wfTitle }}<\u002Fh4>\n              <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n                <span style=\"font:500 12px/1 'Instrument Sans',sans-serif;color:#475569\">Knowledge Assist<\u002Fspan>\n                <button type=\"button\" role=\"switch\" aria-checked=\"{{ kaChecked }}\" aria-label=\"Knowledge Assist\" sc-camel-on-click=\"{{ toggleKa }}\" style=\"{{ kaTrackStyle }}\" style-focus=\"outline:2px solid #1d4ed8;outline-offset:2px\"><div style=\"{{ kaKnobStyle }}\"><\u002Fdiv><\u002Fbutton>\n                <span style=\"{{ kaStateStyle }}\">{{ kaStateLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:18px;display:grid;gap:8px\">\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#ffffff;border:1px solid #d9d2c2;border-radius:10px;padding:12px 14px\">\n                <span style=\"font:600 13px/1 'IBM Plex Mono',monospace;color:#0f1b2d\">{{ wf1 }}<\u002Fspan>\n                <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#475569\">VARCHAR(36) · NOT NULL<\u002Fspan>\n                <span style=\"margin-left:auto;font:600 9.5px/1 'IBM Plex Mono',monospace;color:#0f766e;background:rgba(15,118,110,.1);border-radius:6px;padding:5px 8px\">FROM EVIDENCE<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#ffffff;border:1px solid #d9d2c2;border-radius:10px;padding:12px 14px\">\n                <span style=\"font:600 13px/1 'IBM Plex Mono',monospace;color:#0f1b2d\">{{ wf2 }}<\u002Fspan>\n                <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#475569\">{{ wf2t }}<\u002Fspan>\n                <span style=\"margin-left:auto;font:600 9.5px/1 'IBM Plex Mono',monospace;color:#2f6fed;background:rgba(47,111,237,.1);border-radius:6px;padding:5px 8px\">MANUALLY REVIEWED<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"{{ kaSuggestStyle }}\">\n                <div style=\"border:1px dashed #d9c08f;background:#fdf9ef;border-radius:10px;padding:12px 14px\">\n                  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n                    <span style=\"font:600 13px/1 'IBM Plex Mono',monospace;color:#0f1b2d\">{{ wf3 }}<\u002Fspan>\n                    <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#475569\">{{ wf3v }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font:600 9.5px/1 'IBM Plex Mono',monospace;color:#b45309;background:rgba(180,83,9,.12);border-radius:6px;padding:5px 8px\">ASSIST-SUGGESTED<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px\">\n                    <span style=\"font:400 11.5px/1.4 'Instrument Sans',sans-serif;color:#8a6a2f\">evidence: {{ wfPolicy }} §2.1<\u002Fspan>\n                    <div style=\"margin-left:auto;display:flex;gap:8px\">\n                      <span style=\"font:600 11px/1 'Instrument Sans',sans-serif;color:#15803d;border:1px solid rgba(21,128,61,.4);border-radius:7px;padding:6px 12px;cursor:pointer\">Accept<\u002Fspan>\n                      <span style=\"font:600 11px/1 'Instrument Sans',sans-serif;color:#475569;border:1px solid #dbe3ee;border-radius:7px;padding:6px 12px;cursor:pointer\">Edit<\u002Fspan>\n                      <span style=\"font:600 11px/1 'Instrument Sans',sans-serif;color:#b91c1c;border:1px solid rgba(185,28,28,.35);border-radius:7px;padding:6px 12px;cursor:pointer\">Reject<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"{{ kaOffNoteStyle }}\">Knowledge Assist ships off by default. Turn it on to see evidence-backed suggestions — each one cites its source, and nothing is applied until you accept it.<\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ wizPaneNStyle }}\">\n              <h4 style=\"margin:0;font:650 16px/1.2 'Instrument Sans',sans-serif;color:#1e3a5f\">{{ wizTitle }}<\u002Fh4>\n              <div style=\"margin-top:18px;display:grid;gap:8px\">\n                <sc-for list=\"{{ wizRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#ffffff;border:1px solid #d9d2c2;border-radius:10px;padding:12px 14px\">\n                    <span style=\"font:600 13px/1 'IBM Plex Mono',monospace;color:#0f1b2d\">{{ r.name }}<\u002Fspan>\n                    <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#475569\">{{ r.meta }}<\u002Fspan>\n                    <span style=\"{{ r.badgeStyle }}\">{{ r.badge }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;font:400 12.5px/1.6 'Instrument Sans',sans-serif;color:#475569\">{{ wizNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"genflow\" data-reveal=\"\" style=\"display:{{ techDisp }};scroll-margin-top:74px\">\n        <div style=\"max-width:780px;margin-top:64px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">05 · DETERMINISTIC ENGINE GENERATION<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(22px,2.7vw,30px)/1.18 'Instrument Sans',sans-serif;letter-spacing:-.7px;color:#ffffff;text-wrap:balance\">The Engine compiles the reviewed manifest — or fails fast.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Greenfield generation is deterministic for the same reviewed manifest package and Engine version; CRUD regeneration also binds the committed baseline/package state and preserved developer-owned files. Trace the full path below, from edge evidence to validated output.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- optional technical depth: one contract, both directions -->\n      <div style=\"display:{{ techDisp }}\">\n      <div data-reveal=\"\" style=\"margin-top:64px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px 16px;flex-wrap:wrap;margin-bottom:14px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2dd4bf\">DETERMINISTIC · OR IT FAILS FAST<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 'Instrument Sans',sans-serif;color:#a8bcd9\">Pick a contract family and inspect what generates in its supported directions. <span style=\"color:#8ea3c2\">{{ techDomainNote }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-ef-darkpanel=\"\" style=\"background:#050b16;border-radius:20px;padding:34px 10px 10px;overflow:hidden;box-shadow:0 24px 60px rgba(2,6,12,.5)\">\n    <div style=\"position:relative;max-width:1150px;margin:0 auto;padding:0 18px 24px\">\n      <div style=\"text-align:center;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:2px;color:#a3b8d6;margin-bottom:22px\">ONE CONTRACT · ITS SUPPORTED DIRECTIONS — PICK A FAMILY<\u002Fdiv>\n      <div style=\"display:flex;align-items:stretch;gap:0;flex-wrap:wrap;justify-content:center\">\n\n        <!-- contract panel -->\n        <div style=\"flex:1 1 360px;max-width:490px;min-width:0;background:rgba(10,19,34,.85);border:1px solid rgba(255,255,255,.13);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)\">\n            <span style=\"{{ famChipStyle }}\">{{ famMono }}<\u002Fspan>\n            <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;color:#c3d4ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ contractFile }}<\u002Fspan>\n            <span style=\"margin-left:auto;font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#7db8ff\">EDGE CONTRACTS · IN<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px;min-height:238px;font-family:'IBM Plex Mono',monospace\">\n            <sc-for list=\"{{ contractLines }}\" as=\"ln\" hint-placeholder-count=\"7\">\n              <div style=\"{{ ln.style }}\">{{ ln.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- engine gate -->\n        <div data-ef-gate=\"\" style=\"flex:0 0 168px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 6px\">\n          <div style=\"font:600 9px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.2px;color:#a8bcd9;text-align:center;margin-bottom:12px\">CANONICAL MODEL<br>reviewed, versioned manifest<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;width:100%\">\n            <div style=\"{{ connLeftStyle }}\"><\u002Fdiv>\n            <div style=\"{{ gateStyle }}\"><div style=\"{{ gateDotStyle }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"{{ connRightStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:2px;color:#dcebfb;margin-top:14px\">ENGINE<\u002Fdiv>\n          <div style=\"font:500 9.5px/1.5 'Instrument Sans',sans-serif;color:#a8bcd9;margin-top:5px;text-align:center\">deterministic ·<br>or fails fast<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- artifact panel -->\n        <div style=\"flex:1 1 360px;max-width:490px;min-width:0;background:rgba(10,19,34,.85);border:1px solid rgba(255,255,255,.13);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)\">\n            <span style=\"width:22px;height:22px;border-radius:6px;background:rgba(45,212,191,.14);color:#2dd4bf;display:inline-flex;align-items:center;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace;flex:none\">SB<\u002Fspan>\n            <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;color:#c3d4ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ outputFile }}<\u002Fspan>\n            <span style=\"margin-left:auto;font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#2dd4bf\">GENERATED APP · OUT<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px;min-height:238px;font-family:'IBM Plex Mono',monospace\">\n            <sc-for list=\"{{ outputLines }}\" as=\"ln\" hint-placeholder-count=\"8\">\n              <div style=\"{{ ln.style }}\">{{ ln.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:18px;text-align:center;font:500 12px/1.6 'IBM Plex Mono',monospace;color:#a8bcd9\">{{ famBoth }}<\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px\">\n        <sc-for list=\"{{ famTabs }}\" as=\"tab\" hint-placeholder-count=\"5\">\n          <button type=\"button\" sc-camel-on-click=\"{{ tab.click }}\" style=\"{{ tab.style }}\"><span style=\"{{ tab.dotStyle }}\"><\u002Fspan>{{ tab.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n      <!-- trace: collapsed by default -->\n      <div style=\"display:{{ techDisp }}\">\n      <div id=\"trace-rail\" data-reveal=\"\" style=\"margin-top:56px\">\n        <div style=\"{{ traceClosedStyle }}\">\n          <div style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#152740;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px 26px;box-shadow:0 10px 28px rgba(0,0,0,.3)\">\n            <div style=\"flex:1 1 320px;min-width:0\">\n              <h3 style=\"margin:0;font:650 20px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.4px;color:#ffffff\">Trace one contract through EdgeForge<\u002Fh3>\n              <p style=\"margin:8px 0 0;font:400 14px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea;text-wrap:pretty\">Follow a single contract from edge input to validated cutover — and safe regeneration — one step at a time.<\u002Fp>\n              <div style=\"margin-top:12px;font:600 12px/1.6 'IBM Plex Mono',monospace;color:#8ea3c2\">Ingest → Review → Generate → Validate → Regenerate safely<\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ openTrace }}\" style=\"flex:none;display:inline-flex;align-items:center;gap:9px;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.45);color:#2dd4bf;font:600 13px/1 'Instrument Sans',sans-serif;padding:13px 22px;border-radius:100px;cursor:pointer\" style-hover=\"background:rgba(45,212,191,.2)\">Trace the path <span style=\"font-family:'IBM Plex Mono',monospace\">→<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ traceOpenStyle }}\">\n          <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n            <h3 style=\"margin:0;font:650 20px/1.2 'Instrument Sans',sans-serif;letter-spacing:-.4px;color:#ffffff\">Trace the data path<\u002Fh3>\n            <button type=\"button\" sc-camel-on-click=\"{{ runTrace }}\" style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.45);color:#2dd4bf;font:600 12.5px/1 'Instrument Sans',sans-serif;padding:10px 18px;border-radius:100px;cursor:pointer\" style-hover=\"background:rgba(45,212,191,.2)\">{{ traceBtnLabel }}<\u002Fbutton>\n            <span style=\"font:400 12.5px/1.5 'Instrument Sans',sans-serif;color:#8ea3c2\">Explore how one contract moves from evidence to reviewed manifest, generated app, validation, and safe regeneration.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;margin-top:28px;overflow-x:auto;padding-bottom:6px\">\n            <sc-for list=\"{{ traceNodes }}\" as=\"n\" hint-placeholder-count=\"8\">\n              <div style=\"display:contents\">\n                <div style=\"{{ n.connStyle }}\"><\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ n.click }}\" sc-camel-on-mouse-enter=\"{{ n.hover }}\" sc-camel-on-focus=\"{{ n.hover }}\" aria-label=\"{{ n.aria }}\" style=\"{{ n.btnStyle }}\">\n                  <div style=\"{{ n.dotStyle }}\">{{ n.tag }}<\u002Fdiv>\n                  <div style=\"{{ n.labelStyle }}\">{{ n.label }}<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:20px;min-height:54px;max-width:760px;font:400 15px/1.6 'Instrument Sans',sans-serif;color:#c3d4ea;text-wrap:pretty\">{{ traceCaption }}<\u002Fdiv>\n          <div style=\"margin-top:14px;font:500 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#2dd4bf\">INGEST → REVIEW → GENERATE → VALIDATE → REGENERATE SAFELY<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n      <div style=\"display:{{ techDisp }}\">\n      <!-- generated app · engineering handoff -->\n      <div data-howband=\"\">\n      <div id=\"handoff-panel\" data-reveal=\"\" style=\"margin-top:56px\">\n        <div style=\"max-width:780px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#7db8ff\">06 · GENERATED REPOSITORY ANATOMY &amp; EXTENSION SEAMS<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(22px,2.7vw,30px)/1.18 'Instrument Sans',sans-serif;letter-spacing:-.7px;color:#ffffff;text-wrap:balance\">Deterministic to generate. Structured for engineering teams to extend.<\u002Fh3>\n          <div style=\"display:{{ techDisp }}\">\n          <p style=\"margin:16px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">EdgeForge emits a standard, independently buildable Spring Boot/Maven repository with build and run guidance, Docker packaging, externalized configuration, a health endpoint, and no runtime dependency on EdgeForge, Studio, Knowledge Assist, or MCP.<\u002Fp>\n          <p style=\"margin:12px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#a8bcd9;text-wrap:pretty\">Teams can open the repository in their normal IDE and, subject to adopter policy, an approved repository-aware coding assistant. <span style=\"color:#ffffff;font-weight:600\">EdgeForge does not use an AI provider to decide or generate the application structure.<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ techDisp }}\">\n        <div role=\"tablist\" aria-label=\"Generated app handoff stages\" style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:26px\">\n          <sc-for list=\"{{ hoTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <button type=\"button\" role=\"tab\" id=\"{{ t.tabId }}\" aria-selected=\"{{ t.selected }}\" aria-controls=\"{{ t.controls }}\" sc-camel-tab-index=\"{{ t.tabIdx }}\" sc-camel-on-click=\"{{ t.click }}\" sc-camel-on-key-down=\"{{ t.keydown }}\" style=\"{{ t.style }}\" style-focus=\"outline:2px solid #7db8ff;outline-offset:2px\"><span style=\"{{ t.dotStyle }}\"><\u002Fspan>{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <button type=\"button\" sc-camel-on-click=\"{{ hoReplay }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:100px;cursor:pointer;border:1px solid #c4d0e0;background:#ffffff;color:#51617a;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:1px\" style-hover=\"color:#0f1b2d;border-color:#8a9cb8\">↻&nbsp;REPLAY PASS<\u002Fbutton>\n          <span style=\"font:400 12px/1.4 'Instrument Sans',sans-serif;color:#8ea3c2\">Plays once on reveal — click a stage to explore. <span style=\"color:#64748b\">· {{ hoDomainNote }}<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n\n        <div data-ef-darkpanel=\"\" style=\"margin-top:14px;background:#050b16;border:1px solid rgba(15,27,45,.35);border-radius:20px;padding:24px 24px 20px;overflow:hidden;box-shadow:0 24px 60px rgba(15,27,45,.28)\">\n          <div style=\"min-height:380px;display:flex;flex-direction:column;justify-content:center\">\n          <sc-if value=\"{{ hoIs0 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div role=\"tabpanel\" id=\"ho-panel-0\" aria-labelledby=\"ho-tab-0\" style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n              <div style=\"flex:1 1 250px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n                <div data-anim=\"\" style=\"animation:efRise .55s cubic-bezier(.22,1,.36,1) .05s backwards;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.3);border-radius:12px;padding:15px 17px\">\n                  <div style=\"font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#2dd4bf;margin-bottom:8px\">UPSTREAM CONTRACTS · REVIEWED<\u002Fdiv>\n                  <div style=\"font:400 12px/1.7 'IBM Plex Mono',monospace;color:#c3d4ea\">OpenAPI · XSD / WSDL · file layouts · staging DDL<\u002Fdiv>\n                <\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .55s cubic-bezier(.22,1,.36,1) .2s backwards;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.3);border-radius:12px;padding:15px 17px\">\n                  <div style=\"font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#2dd4bf;margin-bottom:8px\">DOWNSTREAM OBLIGATIONS · REVIEWED<\u002Fdiv>\n                  <div style=\"font:400 12px/1.7 'IBM Plex Mono',monospace;color:#c3d4ea\">writers · serializers · invoke clients · handoffs<\u002Fdiv>\n                <\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .55s cubic-bezier(.22,1,.36,1) .38s backwards;display:flex;align-items:center;gap:9px;font:600 10.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:.6px;color:#8ea3c2;padding:0 4px\"><span style=\"color:#2dd4bf;font-size:14px\">↓<\u002Fspan> reviewed manifest → the Engine emits the repository<\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .55s cubic-bezier(.22,1,.36,1) 1.05s backwards;display:flex;flex-wrap:wrap;gap:7px;margin-top:auto\">\n                  <span style=\"font:600 10px/1 'IBM Plex Mono',monospace;color:#7db8ff;background:rgba(125,184,255,.1);border-radius:6px;padding:6px 9px\">INDEPENDENTLY BUILDABLE<\u002Fspan>\n                  <span style=\"font:600 10px/1 'IBM Plex Mono',monospace;color:#7db8ff;background:rgba(125,184,255,.1);border-radius:6px;padding:6px 9px\">HEALTH ENDPOINT<\u002Fspan>\n                  <span style=\"font:600 10px/1 'IBM Plex Mono',monospace;color:#2dd4bf;background:rgba(45,212,191,.1);border-radius:6px;padding:6px 9px\">NO EDGEFORGE RUNTIME DEPENDENCY<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1.5 1 380px;min-width:0;background:rgba(10,19,34,.85);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:16px 18px\">\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .25s backwards;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px\">\n                  <span style=\"font:600 12px/1 'IBM Plex Mono',monospace;color:#eaf1fb\">{{ hoSvc }}<\u002Fspan>\n                  <span style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1px;color:#8ea3c2\">STANDARD SPRING BOOT / MAVEN REPOSITORY<\u002Fspan>\n                <\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .35s backwards;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 12.5px/2 'IBM Plex Mono',monospace;color:#c3d4ea\"><span style=\"white-space:nowrap\">├─ src/main/java/…/{{ hoPkg }}/<\u002Fspan><span style=\"color:#8ea3c2;font-size:11px\">generated app code<\u002Fspan><\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .45s backwards;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 12.5px/2 'IBM Plex Mono',monospace;color:#c3d4ea\"><span style=\"white-space:nowrap\">├─ src/main/resources/application.yaml<\u002Fspan><span style=\"color:#8ea3c2;font-size:11px\">externalized configuration<\u002Fspan><\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .55s backwards;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 12.5px/2 'IBM Plex Mono',monospace;color:#c3d4ea\"><span style=\"white-space:nowrap\">├─ src/main/resources/db/migration/<\u002Fspan><span style=\"color:#8ea3c2;font-size:11px\">Flyway migrations<\u002Fspan><\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .65s backwards;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 12.5px/2 'IBM Plex Mono',monospace;color:#c3d4ea\"><span style=\"white-space:nowrap\">├─ pom.xml<\u002Fspan><span style=\"color:#8ea3c2;font-size:11px\">standard Maven build<\u002Fspan><\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .75s backwards;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 12.5px/2 'IBM Plex Mono',monospace;color:#c3d4ea\"><span style=\"white-space:nowrap\">├─ Dockerfile<\u002Fspan><span style=\"color:#8ea3c2;font-size:11px\">container packaging<\u002Fspan><\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .85s backwards;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 12.5px/2 'IBM Plex Mono',monospace;color:#c3d4ea\"><span style=\"white-space:nowrap\">├─ README.md<\u002Fspan><span style=\"color:#8ea3c2;font-size:11px\">build &amp; run guidance<\u002Fspan><\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) 1s backwards;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font:600 12.5px/2 'IBM Plex Mono',monospace;color:#2dd4bf;background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);border-radius:8px;padding:2px 10px;margin-top:6px\"><span style=\"white-space:nowrap\">└─ agent-context.md<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"font:400 11px/1.4 'IBM Plex Mono',monospace;color:#c3d4ea\">deterministic app context<\u002Fspan><span style=\"font:600 9px/1 'IBM Plex Mono',monospace;letter-spacing:.8px;color:#050b16;background:#2dd4bf;border-radius:5px;padding:4px 7px\">CRUD + PASSTHROUGH<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hoIs1 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"tabpanel\" id=\"ho-panel-1\" aria-labelledby=\"ho-tab-1\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n              <div data-anim=\"\" style=\"animation:efRise .55s cubic-bezier(.22,1,.36,1) .05s backwards;flex:1 1 280px;min-width:0;background:rgba(125,184,255,.05);border:1px solid rgba(125,184,255,.28);border-top:3px solid #7db8ff;border-radius:12px;padding:16px 18px\">\n                <div style=\"display:flex;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px\">\n SED CHANGE · AWAITING HUMAN REVIEW<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-anim=\"\" style=\"animation:efRise .5s ease 1.3s backwards;margin-top:12px;font:400 12.5px/1.6 'Instrument Sans',sans-serif;color:#8ea3c2;text-wrap:pretty\">A developer — or, subject to adopter policy, an approved repository-aware coding assistant — proposes changes only in the developer-owned lane. Generated files are refreshed by the Engine, not edited in place.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hoIs2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"tabpanel\" id=\"ho-panel-2\" aria-labelledby=\"ho-tab-2\" style=\"display:flex;flex-direction:column;justify-content:center\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:stretch\">\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .05s backwards;flex:1 1 205px;min-width:0;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.3);border-radius:12px;padding:14px 16px\">\n                  <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#2dd4bf;margin-bottom:9px\">REVIEWED MANIFEST · NEXT VERSION<\u002Fdiv>\n                  <div style=\"font:600 12.5px/1.5 'IBM Plex Mono',monospace;color:#eaf1fb;overflow-wrap:break-word\">{{ hoNewField }}<\u002Fdiv>\n                  <div style=\"font:400 11px/1.5 'IBM Plex Mono',monospace;color:#8ea3c2;margin-top:4px\">optional field · approved in Studio<\u002Fdiv>\n                <\u002Fdiv>\n                <div data-anim=\"\" aria-hidden=\"true\" style=\"animation:efRise .4s ease .3s backwards;flex:none;align-self:center;color:#8ea3c2;font:600 14px/1 'IBM Plex Mono',monospace\">→<\u002Fdiv>\n                <div data-anim=\"\" style=\"animation:efRise .5s cubic-bezier(.22,1,.36,1) .4s backwards;flex:1 1 220px;min-width:0;background:rgba(125,184,255,.05)

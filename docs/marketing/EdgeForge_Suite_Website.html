  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

inite;animation-delay:-12s\"><div style=\"width:48%;height:5px;border-radius:3px;background:rgba(125,184,255,.11)\"><\u002Fdiv><div style=\"width:32%;height:5px;border-radius:3px;background:rgba(125,184,255,.08);margin-top:8px\"><\u002Fdiv><\u002Fdiv>\n        <div data-anim=\"\" data-ef-fxpanel=\"\" style=\"position:absolute;right:22%;top:42%;width:115px;height:75px;border:1px solid rgba(45,212,191,.12);border-radius:10px;padding:11px;box-sizing:border-box;animation:efDrift 25s ease-in-out infinite;animation-delay:-17s\"><div style=\"width:56%;height:4px;border-radius:3px;background:rgba(45,212,191,.1)\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- hero fx: forge sweep -->\n    <sc-if value=\"{{ showFxSweep }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-anim=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(112deg,transparent 42%,rgba(125,184,255,.07) 50%,transparent 58%);background-size:260% 100%;background-repeat:no-repeat;animation:efSweep 13s linear infinite\"><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div aria-hidden=\"true\" style=\"{{ heroMotifStyle }}\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:140px 28px 110px;min-height:86vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center\">\n      <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:16px\"><span style=\"font:800 25px/1 'Instrument Sans',sans-serif;letter-spacing:-.5px;color:#ffffff\">Edge<span style=\"color:#7db8ff\">Forge<\u002Fspan><\u002Fspan><span style=\"font:600 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:3.4px;color:#9db8d8\">SUITE<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:28px\">\n        <span style=\"{{ heroModeChipStyle }}\"><span style=\"{{ heroModeChipDot }}\"><\u002Fspan>{{ heroModeLabel }}<\u002Fspan>\n        <span style=\"font:400 12.5px/1.5 'Instrument Sans',sans-serif;color:#8fa9cc;max-width:520px;text-wrap:balance\">{{ heroModeCue }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isBizFlag }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:3px;color:#2dd4bf;margin-bottom:18px\">CONTRACT-PRESERVING MODERNIZATION<\u002Fdiv>\n        <h1 style=\"margin:0 auto;max-width:880px;font:700 clamp(40px,5.6vw,74px)/1.05 'Instrument Sans',sans-serif;letter-spacing:-2.2px;color:#ffffff;text-wrap:balance\">Modernize legacy applications while preserving the systems around them.<\u002Fh1>\n        <p style=\"margin:28px auto 0;max-width:700px;font:400 17.5px/1.65 'Instrument Sans',sans-serif;color:#b7c9e2;text-wrap:pretty\">EdgeForge helps teams make explicit and approve what an application receives, produces, and must continue honoring. From that reviewed contract set, it generates a runnable, standalone Spring Boot application foundation that engineering can extend, validate, operate, and evolve.<\u002Fp>\n        <div style=\"margin:16px auto 0;max-width:620px;font:500 13.5px/1.6 'Instrument Sans',sans-serif;color:#8fb4e3;text-wrap:pretty\">Human review remains mandatory. EdgeForge supplies the governed application foundation; engineering implements the domain-specific behavior.<\u002Fdiv>\n        <div style=\"margin:14px auto 0;font:600 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#9db8d8\">REVIEWED OBLIGATIONS · REPEATABLE GENERATION · INDEPENDENT RUNTIME<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;justify-content:center;margin-top:38px;flex-wrap:wrap\">\n          <a href=\"#fit\" style=\"display:inline-flex;align-items:center;gap:8px;background:#2f6fed;color:#ffffff;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px;box-shadow:0 8px 24px rgba(47,111,237,.35)\" style-hover=\"background:#1d4ed8;color:#ffffff\">See where EdgeForge fits <span style=\"font-family:'IBM Plex Mono',monospace\">↓<\u002Fspan><\u002Fa>\n          <a href=\"#roadmap\" style=\"display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);color:#dcebfb;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px\" style-hover=\"border-color:rgba(255,255,255,.5);color:#ffffff\">Review what ships today<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isTechFlag }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:3px;color:#7db8ff;margin-bottom:18px\">TECHNICAL EVALUATION<\u002Fdiv>\n        <h1 style=\"margin:0 auto;max-width:880px;font:700 clamp(40px,5.6vw,74px)/1.05 'Instrument Sans',sans-serif;letter-spacing:-2.2px;color:#ffffff;text-wrap:balance\">Evaluate EdgeForge against your existing contract ecosystem.<\u002Fh1>\n        <p style=\"margin:28px auto 0;max-width:700px;font:400 17.5px/1.65 'Instrument Sans',sans-serif;color:#cfdcf0;text-wrap:pretty\">Model supported upstream and downstream interfaces, mappings, rules, and handoffs in Studio. EdgeForge Engine validates the reviewed manifest and generates a standalone Spring Boot repository deterministically. Proven CRUD evolution preserves developer-owned service logic and refuses destructive or drifted changes.<\u002Fp>\n        <div style=\"margin:16px auto 0;max-width:620px;font:500 13.5px/1.6 'Instrument Sans',sans-serif;color:#a9c6ee;text-wrap:pretty\">Engineers still implement product-specific workflows, policies, authorization, domain-specific exception behavior beyond the generated baseline validation and error responses, and unsupported integration behavior.<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;justify-content:center;margin-top:38px;flex-wrap:wrap\">\n          <a href=\"#problem\" style=\"display:inline-flex;align-items:center;gap:8px;background:#2f6fed;color:#ffffff;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px;box-shadow:0 8px 24px rgba(47,111,237,.35)\" style-hover=\"background:#1d4ed8;color:#ffffff\">Inspect supported contracts <span style=\"font-family:'IBM Plex Mono',monospace\">↓<\u002Fspan><\u002Fa>\n          <a href=\"#genflow\" style=\"display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);color:#dcebfb;font:600 14.5px/1 'Instrument Sans',sans-serif;padding:15px 28px;border-radius:10px\" style-hover=\"border-color:rgba(255,255,255,.5);color:#ffffff\">Follow the generation flow<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"margin-top:44px\">\n        <span style=\"display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);border-radius:100px;padding:10px 18px;font:600 11.5px/1 'IBM Plex Mono',monospace;color:#c3d4ea\"><span style=\"width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80\"><\u002Fspan>v4.1.0 suite acceptance passed for documented scenarios<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fheader>\n\n  <!-- ============ WHY IT MATTERS (light) ============ -->\n  <section id=\"problem\" data-screen-label=\"Why it matters\" style=\"position:relative;overflow:hidden;background:#f5f7fb;color:#0f1b2d\">\n    <div data-anim=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(30,58,95,.05) 1px,transparent 1.6px);background-size:32px 32px;animation:efFloat 80s linear infinite;mask-image:radial-gradient(ellipse 100% 80% at 50% 40%,#000,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 40%,#000,transparent 78%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:104px 28px 96px\">\n      <div style=\"display:{{ ovDisp }}\">\n      <div data-reveal=\"\" style=\"max-width:760px\">\n        <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#b45309;margin-bottom:16px\">THE APPLICATION IS ONLY HALF THE SYSTEM<\u002Fdiv>\n        <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">The API tests passed.<span style=\"color:#b91c1c\"> The ecosystem broke.<\u002Fspan><\u002Fh2>\n        <p style=\"margin:20px 0 0;max-width:660px;font:400 16.5px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">Modernization stalls when teams rebuild an application but miss what it owes the systems around it — the files it produces, the interfaces it exposes, the messages other teams consume, the table handoffs that feed overnight processing, the rules recorded in policy documents, and the mappings and consumers that hold it all together.<\u002Fp>\n        <div style=\"margin-top:18px;display:inline-flex;align-items:flex-start;gap:10px;max-width:600px;border-left:2px solid #94a9c4;padding:2px 0 2px 14px;font:400 13px/1.6 'Instrument Sans',sans-serif;color:#475569;text-wrap:pretty\">Examples below follow the selected illustrative domain lens. EdgeForge remains contract-family driven and domain-agnostic.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:44px\">\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 22px 20px\" style-hover=\"border-color:#94a9c4;transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,58,95,.1);transition:all .35s ease\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\"><span style=\"width:26px;height:26px;border-radius:7px;background:rgba(71,85,105,.12);color:#475569;display:inline-flex;align-items:center;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace\">STG<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.2px;color:#475569\">TABLE HANDOFF DRIFT<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">{{ eco1 }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 22px 20px\" style-hover=\"border-color:#94a9c4;transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,58,95,.1);transition:all .35s ease\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\"><span style=\"width:26px;height:26px;border-radius:7px;background:rgba(21,128,61,.12);color:#15803d;display:inline-flex;align-items:center;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace\">FILE<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.2px;color:#15803d\">FILE OBLIGATION DRIFT<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">{{ eco2 }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 22px 20px\" style-hover=\"border-color:#94a9c4;transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,58,95,.1);transition:all .35s ease\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\"><span style=\"width:26px;height:26px;border-radius:7px;background:rgba(79,70,229,.12);color:#4f46e5;display:inline-flex;align-items:center;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace\">EVT<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.2px;color:#4f46e5\">MESSAGE CONSUMER DRIFT<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">{{ eco3 }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:22px 22px 20px\" style-hover=\"border-color:#94a9c4;transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,58,95,.1);transition:all .35s ease\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\"><span style=\"width:26px;height:26px;border-radius:7px;background:rgba(180,83,9,.12);color:#b45309;display:inline-flex;align-items:center;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace\">RULE<\u002Fspan><span style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.2px;color:#b45309\">DOCUMENTED RULE DRIFT<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Instrument Sans',sans-serif;color:#48596f\">{{ eco4 }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- upstream / downstream explainer -->\n      <div data-reveal=\"\" style=\"max-width:760px;margin-top:64px\">\n        <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#2f6fed\">REPLACE THE CENTER<\u002Fdiv>\n        <h3 style=\"margin:14px 0 0;font:650 clamp(21px,2.5vw,28px)/1.2 'Instrument Sans',sans-serif;letter-spacing:-.6px;color:#1e3a5f;text-wrap:balance\">Replace the center. Preserve the obligations.<\u002Fh3>\n        <p style=\"margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">Upstream is what depends on you. Downstream is what you must continue honoring. Before any implementation changes, both sides become explicit obligations that accountable people review.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"position:relative;max-width:1080px;margin:24px auto 0\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;justify-content:center\">\n          <div style=\"flex:1 1 250px;min-width:0;background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:18px 20px\">\n            <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.3px;color:#2f6fed;margin-bottom:10px\">UPSTREAM · WHAT DEPENDS ON YOU<\u002Fdiv>\n            <div style=\"font:600 13.5px/1.5 'Instrument Sans',sans-serif;color:#1e3a5f\">APIs, bounded interfaces, inbound files and feeds<\u002Fdiv>\n            <div style=\"margin-top:6px;font:400 12px/1.4 'Instrument Sans',sans-serif;color:#475569\">what other systems send or call<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:none;align-self:center;color:#2f6fed;font:600 20px/1 'IBM Plex Mono',monospace;padding:0 2px\">→<\u002Fdiv>\n          <div style=\"flex:1 1 260px;min-width:0;background:linear-gradient(180deg,rgba(47,111,237,.09),rgba(15,118,110,.05));border:1px solid rgba(47,111,237,.35);border-radius:14px;padding:18px 20px\">\n            <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.3px;color:#1e3a5f;margin-bottom:10px\">THE REVIEWED CONTRACT SET<\u002Fdiv>\n            <div style=\"font:600 13.5px/1.5 'Instrument Sans',sans-serif;color:#1e3a5f\">One explicit, human-approved definition<\u002Fdiv>\n            <div style=\"margin-top:6px;font:400 12px/1.4 'Instrument Sans',sans-serif;color:#475569\">of what the application receives, produces, and must continue honoring<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:none;align-self:center;color:#0f766e;font:600 20px/1 'IBM Plex Mono',monospace;padding:0 2px\">→<\u002Fdiv>\n          <div style=\"flex:1 1 250px;min-width:0;background:#ffffff;border:1px solid #e4e9f1;border-radius:14px;padding:18px 20px\">\n            <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.3px;color:#0f766e;margin-bottom:10px\">DOWNSTREAM · WHAT YOU CONTINUE HONORING<\u002Fdiv>\n            <div style=\"font:600 13.5px/1.5 'Instrument Sans',sans-serif;color:#1e3a5f\">files · messages · table handoffs · outbound calls<\u002Fdiv>\n            <div style=\"margin-top:6px;font:400 12px/1.4 'Instrument Sans',sans-serif;color:#475569\">what the application produces or invokes<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;text-align:center;font:500 13px/1.6 'Instrument Sans',sans-serif;color:#475569;max-width:720px;margin-left:auto;margin-right:auto\">Upstream is what depends on you. Downstream is what you must continue honoring. Both sides become explicit, reviewed obligations before implementation changes — in the directions each contract family actually supports.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:{{ techDisp }}\">\n        <div id=\"contracts\" style=\"max-width:820px\">\n          <div style=\"font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;color:#0f766e;margin-bottom:16px\">01 · SUPPORTED CONTRACT COVERAGE<\u002Fdiv>\n          <h2 style=\"margin:0;font:700 clamp(30px,3.6vw,44px)/1.12 'Instrument Sans',sans-serif;letter-spacing:-1.4px;color:#1e3a5f;text-wrap:balance\">The supported edge, at a glance.<\u002Fh2>\n          <p style=\"margin:18px 0 0;max-width:700px;font:400 16px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">EdgeForge preserves reviewed obligations in the directions shown below. The manifest and its referenced artifacts remain the exact generation contract.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:28px;background:#faf8f3;border:1px solid #d7d1c6;border-radius:10px;padding:22px;box-shadow:0 12px 28px rgba(30,58,95,.05)\">\n          <div data-dl-flow=\"\" style=\"display:flex;align-items:stretch;gap:16px\">\n            <div style=\"flex:1 1 0;min-width:0;background:#f7f9fe;border:1px solid #d9e4f2;border-radius:8px;padding:18px\">\n              <div style=\"font:700 10px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#1d4ed8\">INBOUND · WHAT ENTERS OR CALLS THE APP<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n                <span style=\"padding:8px 10px;border-radius:7px;background:#eaf1fd;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">REST / OpenAPI<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#edf5ef;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">Fixed-width<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#f0effb;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">CSV / delimited<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#f7eee5;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">XML / XSD<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#eaf3f8;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">SOAP / WSDL · bounded<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div data-dl-arrow=\"\" aria-hidden=\"true\" style=\"flex:none;align-self:center;color:#0f766e;font:700 20px/1 'IBM Plex Mono',monospace\">→<\u002Fdiv>\n\n            <div style=\"flex:0 1 220px;min-width:180px;background:linear-gradient(180deg,#edf4fd,#eef7f5);border:1px solid #b9d8d3;border-radius:8px;padding:18px;display:flex;flex-direction:column;justify-content:center;text-align:center\">\n              <div style=\"font:700 10px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#0f766e\">REVIEWED CANONICAL MODEL<\u002Fdiv>\n              <div style=\"margin-top:8px;font:600 13px/1.5 'Instrument Sans',sans-serif;color:#1e3a5f\">Human-approved mappings, rules and handoffs<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div data-dl-arrow=\"\" aria-hidden=\"true\" style=\"flex:none;align-self:center;color:#0f766e;font:700 20px/1 'IBM Plex Mono',monospace\">→<\u002Fdiv>\n\n            <div style=\"flex:1 1 0;min-width:0;background:#f3f9f7;border:1px solid #cfe3dd;border-radius:8px;padding:18px\">\n              <div style=\"font:700 10px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#0f766e\">DOWNSTREAM · WHAT THE APP PRODUCES OR INVOKES<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n                <span style=\"padding:8px 10px;border-radius:7px;background:#e8f3eb;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">Fixed-width<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#efeffa;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">CSV / delimited<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#f7eee5;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">XML / XSD<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#e8f2f7;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">SOAP / WSDL · bounded<\u002Fspan>\n                <span style=\"padding:8px 10px;border-radius:7px;background:#f3edf9;color:#1e3a5f;font:600 12px/1 'IBM Plex Mono',monospace\">Staging / table handoff<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;padding-top:16px;border-top:1px solid #d7dfe8;font:500 11.5px/1.55 'Instrument Sans',sans-serif;color:#475569\">\n            <span><strong style=\"color:#1e3a5f\">REST:<\u002Fstrong> CRUD inbound; passthrough invokes declared downstream operations<\u002Fspan>\n            <span><strong style=\"color:#1e3a5f\">SOAP:<\u002Fstrong> canonical runtime bounded to lookup/call by ID<\u002Fspan>\n            <span><strong style=\"color:#1e3a5f\">Staging:<\u002Fstrong> opt-in run identity, resume, and idempotent per-run writes — durable on PostgreSQL, same-process on H2<\u002Fspan>\n            <span><strong style=\"color:#1e3a5f\">Kafka &amp; passthrough:<\u002Fstrong> generated application shapes, not extra family directions<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- illustrative domain lens -->\n      <div data-reveal=\"\" style=\"margin-top:64px\">\n        <div style=\"max-width:760px\">\n          <div style=\"font:600 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;color:#0f766e\">ILLUSTRATIVE DOMAIN LENS<\u002Fdiv>\n          <h3 style=\"margin:14px 0 0;font:650 clamp(21px,2.5vw,28px)/1.2 'Instrument Sans',sans-serif;letter-spacing:-.6px;color:#1e3a5f;text-wrap:balance\">Different domain. Different contracts. Same governed generation model.<\u002Fh3>\n          <p style=\"display:{{ techDisp }};margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">EdgeForge is contract-family driven, not industry-specific. Select a domain to see how the same reviewed upstream and downstream contract model can frame a different bounded context.<\u002Fp>\n          <p style=\"display:{{ ovDisp }};margin:14px 0 0;font:400 14.5px/1.65 'Instrument Sans',sans-serif;color:#48596f;text-wrap:pretty\">Select a domain to see how the same reviewed obligation model frames a different business context — in business vocabulary, without implementation detail.<\u002Fp>\n        <\u002Fdiv>\n\n        <div role=\"tablist\" aria-label=\"Illustrative domain lens\" style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:22px\">\n          <sc-for list=\"{{ dlTabs }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <button type=\"button\" role=\"tab\" id=\"{{ d.tabId }}\" aria-selected=\"{{ d.selected }}\" aria-controls=\"dl-panel\" sc-camel-tab-index=\"{{ d.tabIdx }}\" sc-camel-on-click=\"{{ d.click }}\" sc-camel-on-key-down=\"{{ d.keydown }}\" style=\"{{ d.style }}\" style-focus=\"outline:2px solid #2f6fed;outline-offset:2px\"><span style=\"{{ d.checkStyle }}\">✓&nbsp;<\u002Fspan>{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div role=\"tabpanel\" id=\"dl-panel\" aria-labelledby=\"{{ dlLabelledBy }}\" style=\"margin-top:14px;background:#ffffff;border:1px solid #e4e9f1;border-radius:16px;padding:22px 24px 18px;box-shadow:0 14px 34px rgba(30,58,95,.06)\">\n          <div style=\"{{ dlFadeStyle }}\">\n            <div style=\"display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:14px\">\n              <span style=\"font:600 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:1.3px;color:#0f766e\">BOUNDED CONTEXT<\u002Fspan>\n              <span style=\"font:650 16px/1.3 'Instrument Sans',sans-serif;letter-spacing:-.2px;color:#1e3a5f\">{{ dlContext }}<\u002Fspan>\n            <\u002Fdiv>\n            <div data-dl-flow=\"\" style=\"display:{{ dlFlowDisp }};gap:10px;align-items:stretch;min-height:216px\">\n              <div style=\"flex:1 1 240px;min-width:0;background:rgba(47,111,237,.04);border:1px solid rgba(47,111,237,.25);border-radius:12px;padding:16px 18px\">\n                <div style=\"font:600 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:1.2px;color:#2f6fed;margin-bottom:10px\">UPSTREAM CONTRACTS · REVIEWED<\u002Fdiv>\n                <div style=\"display:{{ techDisp }}\"><sc-for list=\"{{ dlUp }}\" as=\"u\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:8px;align-items:baseline;font:600 12.5px/1.5 'IBM Plex Mono',monospace;color:#1e3a5f;padding:5px 0\"><span style=\"color:#2f6fed\">▸<\u002Fspan><span style=\"min-width:0;overflow-wrap:break-word\">{{ u.t }}<span style=\"display:block;font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#64748b\">{{ u.m }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for><\u002Fdiv>\n                <div style=\"display:{{ ovDisp }}\"><sc-for list=\"{{ dlUpBiz }}\" as=\"u\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:8px;align-items:baseline;font:600 13px/1.5 'Instrument Sans',sans-serif;color:#1e3a5f;padding:5px 0\"><span style=\"color:#2f6fed;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan><span style=\"min-width:0;overflow-wrap:break-word\">{{ u.t }}<span style=\"display:block;font:400 12px/1.5 'Instrument Sans',sans-serif;color:#64748b\">{{ u.m }}<\u002Fspan><\u002Fspan><\ ;color:#0f766e;margin-bottom:10px\">DOWNSTREAM OBLIGATIONS · REVIEWED<\u002Fdiv>\n                <div style=\"display:{{ techDisp }}\"><sc-for list=\"{{ dlDown }}\" as=\"w\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:8px;align-items:baseline;font:600 12.5px/1.5 'IBM Plex Mono',monospace;color:#1e3a5f;padding:5px 0\"><span style=\"color:#0f766e\">▸<\u002Fspan><span style=\"min-width:0;overflow-wrap:break-word\">{{ w.t }}<span style=\"display:block;font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#64748b\">{{ w.m }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for><\u002Fdiv>\n                <div style=\"display:{{ ovDisp }}\"><sc-for list=\"{{ dlDownBiz }}\" as=\"w\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:8px;align-items:baseline;font:600 13px/1.5 'Instrument Sans',sans-serif;color:#1e3a5f;padding:5px 0\"><span style=\"color:#0f766e;font-family:'IBM Plex Mono',monospace\">▸<\u002Fspan><span style=\"min-width:0;overflow-wrap:break-word\">{{ w.t }}<span style=\"display:block;font:400 12px/1.5 'Instrument Sans',sans-serif;color:#64748b\">{{ w.m }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n<div style=\"display:{{ ovDisp }}\">\n              <p style=\"margin:0 0 16px;font:650 15px/1.5 'Instrument Sans',sans-serif;letter-spacing:-.2px;color:#1e3a5f;max-width:720px;text-wrap:balance\">Replace a bounded application or service at the center. Preserve the systems and obligations around it.<\u002Fp>\n              <div data-dl-eco-grid=\"\">\n                <div style=\"min-width:0;background:rgba(47,111,237,.04);border:1px solid rgba(47,111,237,.25);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"font:600 9.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:1.1px;color:#1d4ed8\">UPSTREAM SYSTEMS · UNCHANGED<\u002Fdiv>\n
